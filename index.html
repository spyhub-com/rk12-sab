<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge</title>
<style>
  :root{
    --bg:#0A0A0C;
    --glass:rgba(255,255,255,0.045);
    --border:rgba(255,255,255,0.09);
    --border-soft:rgba(255,255,255,0.06);
    --text:#F5F5F7;
    --text-dim:#93939B;
    --text-faint:#5A5A62;
    --accent:#5E9EFF;
    --red:#FF6B6B;
    --green:#5FD98A;
    --radius:18px;
    --radius-sm:12px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--bg); color:var(--text); height:100%; overflow:hidden; -webkit-font-smoothing:antialiased; }
  body{ background-image:
      radial-gradient(circle at 15% 20%, rgba(94,158,255,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(94,158,255,0.06), transparent 50%); }
  #app{ height:100vh; width:100vw; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .login-wrap{ height:100%; width:100%; display:flex; align-items:center; justify-content:center; }
  .login-card{ width:380px; padding:40px 36px; background:var(--glass); border:1px solid var(--border);
    border-radius:24px; backdrop-filter:blur(30px) saturate(160%); -webkit-backdrop-filter:blur(30px) saturate(160%);
    box-shadow:0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    animation:riseIn .5s cubic-bezier(.16,1,.3,1); }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(14px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .login-mark{ width:46px; height:46px; border-radius:13px; background:linear-gradient(155deg, var(--accent), #2f5fb8);
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; margin-bottom:22px;
    box-shadow:0 8px 20px rgba(94,158,255,0.35); }
  .login-card h1{ font-size:22px; font-weight:600; letter-spacing:-0.01em; margin-bottom:6px; }
  .login-card p.sub{ color:var(--text-dim); font-size:14px; margin-bottom:28px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; font-weight:500; }
  .field input, .field textarea{ width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border-soft);
    border-radius:11px; padding:12px 14px; color:var(--text); font-size:14.5px; outline:none;
    transition:border-color .15s, background .15s; font-family:inherit; }
  .field input:focus, .field textarea:focus{ border-color:rgba(94,158,255,0.55); background:rgba(255,255,255,0.06); }
  .btn-primary{ width:100%; background:var(--accent); color:#0A0A0C; border:none; border-radius:11px; padding:12px 0;
    font-size:14.5px; font-weight:600; cursor:pointer; margin-top:8px; transition:filter .15s, transform .1s; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .login-toggle{ text-align:center; margin-top:18px; font-size:13.5px; color:var(--text-dim); }
  .login-toggle span{ color:var(--accent); cursor:pointer; }
  .login-error{ color:var(--red); font-size:13px; margin-top:10px; display:none; }
  .login-note{ color:var(--text-faint); font-size:12px; margin-top:14px; text-align:center; }

  .main-layout{ display:flex; height:100%; width:100%; }
  .sidebar{ width:240px; flex-shrink:0; background:rgba(255,255,255,0.02); border-right:1px solid var(--border-soft);
    display:flex; flex-direction:column; padding:20px 14px; backdrop-filter:blur(20px); }
  .sidebar-header{ display:flex; align-items:center; gap:10px; padding:6px 8px 22px 8px; }
  .sidebar-header .mark{ width:30px; height:30px; border-radius:9px; background:linear-gradient(155deg, var(--accent), #2f5fb8);
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; }
  .sidebar-header .name{ font-size:15.5px; font-weight:600; letter-spacing:-0.01em; }
  .nav-group{ margin-bottom:18px; }
  .nav-label{ font-size:11px; color:var(--text-faint); padding:0 10px; margin-bottom:6px; font-weight:600; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; color:var(--text-dim);
    font-size:14px; cursor:pointer; transition:background .12s, color .12s; user-select:none; }
  .nav-item:hover{ background:rgba(255,255,255,0.045); color:var(--text); }
  .nav-item.active{ background:rgba(94,158,255,0.14); color:var(--text); }
  .nav-item .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0.5; }
  .nav-item.active .dot{ background:var(--accent); opacity:1; }
  .sidebar-footer{ margin-top:auto; border-top:1px solid var(--border-soft); padding-top:14px; display:flex;
    align-items:center; gap:10px; padding-left:8px; }
  .avatar{ width:32px; height:32px; border-radius:50%; background:linear-gradient(155deg,#3a3a40,#1c1c1f);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:var(--text-dim);
    border:1px solid var(--border); }
  .user-meta{ line-height:1.25; }
  .user-meta .uname{ font-size:13.5px; font-weight:600; }
  .user-meta .urole{ font-size:11.5px; color:var(--text-faint); }
  .logout-btn{ margin-left:auto; color:var(--text-faint); cursor:pointer; font-size:12px; }
  .logout-btn:hover{ color:var(--red); }

  .content{ flex:1; overflow-y:auto; padding:34px 42px; }
  .content-header{ margin-bottom:26px; }
  .content-header h2{ font-size:24px; font-weight:600; letter-spacing:-0.015em; margin-bottom:5px; }
  .content-header p{ color:var(--text-dim); font-size:14px; max-width:560px; }

  .panel{ background:var(--glass); border:1px solid var(--border); border-radius:var(--radius);
    backdrop-filter:blur(20px) saturate(140%); -webkit-backdrop-filter:blur(20px) saturate(140%); padding:22px; }

  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; margin-top:6px; }
  .stat-card{ background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px; }
  .stat-card .label{ font-size:12.5px; color:var(--text-dim); margin-bottom:10px; }
  .stat-card .value{ font-size:26px; font-weight:600; letter-spacing:-0.02em; }
  .stat-card .value.accent{ color:var(--accent); }

  .editor-wrap{ display:flex; gap:14px; height:calc(100vh - 200px); }
  .editor-pane, .console-pane{ flex:1; background:var(--glass); border:1px solid var(--border); border-radius:var(--radius);
    display:flex; flex-direction:column; overflow:hidden; }
  .pane-bar{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px;
    border-bottom:1px solid var(--border-soft); font-size:12.5px; color:var(--text-dim); }
  .pane-bar .tools{ display:flex; gap:8px; }
  .pill-btn{ background:rgba(255,255,255,0.05); border:1px solid var(--border-soft); color:var(--text-dim);
    font-size:12px; padding:5px 11px; border-radius:8px; cursor:pointer; transition:background .12s, color .12s; }
  .pill-btn:hover{ background:rgba(255,255,255,0.09); color:var(--text); }
  .pill-btn.run{ background:var(--accent); color:#0A0A0C; border:none; font-weight:600; }
  .pill-btn.run:hover{ filter:brightness(1.08); }
  .pill-btn.run:disabled{ opacity:0.5; cursor:not-allowed; }
  .pill-btn.danger:hover{ color:var(--red); }

  textarea.code-input{ flex:1; background:transparent; border:none; outline:none; resize:none; color:var(--text);
    font-family:"SF Mono", Menlo, Consolas, monospace; font-size:13.5px; line-height:1.6; padding:16px; }
  .console-body{ flex:1; padding:16px; font-family:"SF Mono", Menlo, Consolas, monospace; font-size:13px;
    line-height:1.7; overflow-y:auto; color:var(--text-dim); white-space:pre-wrap; }
  .console-body .err{ color:var(--red); }
  .console-body .ok{ color:var(--green); }
  .console-body .sys{ color:var(--text-faint); }

  .autocomplete-box{ position:absolute; background:rgba(28,28,32,0.95); border:1px solid var(--border); border-radius:9px;
    padding:5px; font-family:"SF Mono", Menlo, Consolas, monospace; font-size:13px; backdrop-filter:blur(20px);
    box-shadow:0 12px 30px rgba(0,0,0,0.5); display:none; z-index:50; }
  .autocomplete-item{ padding:6px 10px; border-radius:6px; cursor:pointer; color:var(--text-dim); }
  .autocomplete-item:hover, .autocomplete-item.sel{ background:rgba(94,158,255,0.16); color:var(--text); }

  .lang-tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .lang-tab{ padding:7px 14px; border-radius:9px; background:rgba(255,255,255,0.04); border:1px solid var(--border-soft);
    font-size:13px; color:var(--text-dim); cursor:pointer; }
  .lang-tab.active{ background:rgba(94,158,255,0.16); color:var(--text); border-color:rgba(94,158,255,0.3); }

  .site-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-radius:12px;
    background:rgba(255,255,255,0.03); border:1px solid var(--border-soft); margin-bottom:10px; gap:12px; flex-wrap:wrap; }
  .site-row .link{ color:var(--accent); font-size:13.5px; font-family:"SF Mono", Menlo, monospace; word-break:break-all; }
  .site-row .name{ font-size:14px; font-weight:500; margin-bottom:3px; }
  .site-row .actions{ display:flex; gap:8px; flex-shrink:0; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-faint); }
  .empty-state .big{ font-size:15px; color:var(--text-dim); margin-bottom:4px; }

  .embed-preview{ border-left:3px solid var(--accent); background:rgba(255,255,255,0.03); border-radius:8px;
    padding:14px 16px; margin-top:16px; }
  .embed-preview .etitle{ font-weight:600; font-size:14.5px; margin-bottom:6px; color:#fff; }
  .embed-preview .edesc{ font-size:13.5px; color:#dcdde0; line-height:1.5; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(28,28,32,0.92); border:1px solid var(--border); padding:12px 20px; border-radius:12px;
    font-size:13.5px; backdrop-filter:blur(20px); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:200; max-width:340px; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .table{ width:100%; border-collapse:collapse; margin-top:10px; }
  .table th{ text-align:left; font-size:12px; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--border-soft); }
  .table td{ font-size:13.5px; padding:10px 10px; border-bottom:1px solid var(--border-soft); }
  .badge{ display:inline-block; padding:3px 9px; border-radius:7px; font-size:11.5px; font-weight:600; }
  .badge.owner{ background:rgba(94,158,255,0.16); color:var(--accent); }
  .badge.member{ background:rgba(255,255,255,0.07); color:var(--text-dim); }

  .settings-section{ margin-bottom:28px; }
  .settings-section h3{ font-size:15px; font-weight:600; margin-bottom:12px; }

  .hidden{ display:none !important; }
  .spinner{ display:inline-block; width:13px; height:13px; border:2px solid rgba(10,10,12,0.3);
    border-top-color:#0A0A0C; border-radius:50%; animation:spin .6s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   CONFIG — adapte cette URL à ton Worker Cloudflare
   ========================================================= */
const API_BASE = "https://host.spyuhq.workers.dev";

/* =========================================================
   ÉTAT
   ========================================================= */
const state = {
  user: null,          // { username, role, token }
  section: 'overview',
  sites: [],
  savedWebhook: localStorage.getItem('forge_webhook') || ''
};

const LUA_KEYWORDS = ["local","function","end","if","then","else","elseif","for","while","do","return","true","false","nil","and","or","not","repeat","until","break","print"];

function toast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* =========================================================
   APPELS API (vers ton Worker) — gèrent l'échec proprement
   ========================================================= */
async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if(state.user && state.user.token) headers['Authorization'] = 'Bearer ' + state.user.token;
  let res;
  try{
    res = await fetch(API_BASE + path, {
      method: opts.method || 'GET',
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  } catch(e){
    throw new Error("Impossible de contacter le serveur (" + API_BASE + "). Vérifie que le Worker est déployé.");
  }
  let data = null;
  try{ data = await res.json(); } catch(e){ /* réponse non-JSON */ }
  if(!res.ok){
    throw new Error((data && data.error) || ("Erreur serveur (" + res.status + ")"));
  }
  return data;
}

/* =========================================================
   RENDER: LOGIN
   ========================================================= */
function renderLogin(mode){
  mode = mode || 'login';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-mark">F</div>
        <h1>${mode==='login' ? 'Connexion' : 'Créer un compte'}</h1>
        <p class="sub">${mode==='login' ? 'Accède à ton espace Forge.' : 'Choisis un pseudo et un mot de passe.'}</p>
        <div class="field">
          <label>Pseudo</label>
          <input id="in-user" type="text" placeholder="ex : spyuhq" autocomplete="username">
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input id="in-pass" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="submit-btn">${mode==='login' ? 'Se connecter' : "S'inscrire"}</button>
        <div class="login-error" id="login-err"></div>
        <div class="login-toggle">
          ${mode==='login' ? `Pas de compte ? <span id="toggle-mode">Créer un compte</span>` : `Déjà un compte ? <span id="toggle-mode">Se connecter</span>`}
        </div>
        <div class="login-note">Connecté à : ${API_BASE}</div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  `;

  document.getElementById('toggle-mode').onclick = ()=> renderLogin(mode==='login' ? 'register' : 'login');

  document.getElementById('submit-btn').onclick = async ()=>{
    const u = document.getElementById('in-user').value.trim();
    const p = document.getElementById('in-pass').value;
    const err = document.getElementById('login-err');
    const btn = document.getElementById('submit-btn');
    err.style.display = 'none';
    if(!u || !p){ err.textContent = 'Remplis le pseudo et le mot de passe.'; err.style.display='block'; return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try{
      const data = await api(mode === 'register' ? '/auth/register' : '/auth/login', {
        method:'POST', body:{ username:u, password:p }
      });
      state.user = { username:data.username, role:data.role, token:data.token };
      renderMain();
    } catch(e){
      err.textContent = e.message;
      err.style.display = 'block';
    } finally{
      btn.disabled = false;
      btn.textContent = mode==='login' ? 'Se connecter' : "S'inscrire";
    }
  };
}

/* =========================================================
   RENDER: MAIN LAYOUT
   ========================================================= */
function navItemsFor(role){
  const base = [
    { group:'Général', items:[ { id:'overview', label:'Aperçu' } ] },
    { group:'Code', items:[ { id:'lua', label:'Lua' }, { id:'devtools', label:'Dev Tools' } ] },
    { group:'Hébergement', items:[ { id:'hosting', label:'Sites hébergés' } ] },
    { group:'Outils', items:[ { id:'discord', label:'Annonce Discord' } ] },
    { group:'Compte', items:[ { id:'settings', label:'Paramètres' } ] },
  ];
  if(role === 'owner'){
    base.splice(1, 0, { group:'Administration', items:[ { id:'admin', label:'Dashboard Owner' } ] });
  }
  return base;
}

function renderMain(){
  const app = document.getElementById('app');
  const NAV = navItemsFor(state.user.role);
  app.innerHTML = `
    <div class="main-layout">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="mark">F</div>
          <div class="name">Forge</div>
        </div>
        <div id="nav-container"></div>
        <div class="sidebar-footer">
          <div class="avatar">${state.user.username.slice(0,2).toUpperCase()}</div>
          <div class="user-meta">
            <div class="uname">${state.user.username}</div>
            <div class="urole">${state.user.role === 'owner' ? 'Owner' : 'Membre'}</div>
          </div>
          <div class="logout-btn" id="logout-btn">Quitter</div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
    <div class="toast" id="toast"></div>
  `;
  renderNav(NAV);
  renderSection(state.section);

  document.getElementById('logout-btn').onclick = ()=>{
    state.user = null;
    renderLogin('login');
  };
}

function renderNav(NAV){
  const c = document.getElementById('nav-container');
  c.innerHTML = NAV.map(g => `
    <div class="nav-group">
      <div class="nav-label">${g.group}</div>
      ${g.items.map(it => `
        <div class="nav-item ${state.section===it.id?'active':''}" data-id="${it.id}">
          <span class="dot"></span><span>${it.label}</span>
        </div>
      `).join('')}
    </div>
  `).join('');
  c.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick = ()=>{ state.section = el.dataset.id; renderNav(NAV); renderSection(state.section); };
  });
}

function renderSection(id){
  const c = document.getElementById('content');
  if(id === 'overview') return renderOverview(c);
  if(id === 'lua') return renderCodeEditor(c, 'lua');
  if(id === 'devtools') return renderCodeEditor(c, 'devtools');
  if(id === 'hosting') return renderHosting(c);
  if(id === 'discord') return renderDiscord(c);
  if(id === 'settings') return renderSettings(c);
  if(id === 'admin') return renderAdmin(c);
}

/* ---------- Overview ---------- */
async function renderOverview(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Bonjour, ${state.user.username}</h2>
      <p>Vue d'ensemble de ton espace.</p>
    </div>
    <div class="grid-cards" id="ov-cards">
      <div class="stat-card"><div class="label">Sites hébergés</div><div class="value accent">…</div></div>
      <div class="stat-card"><div class="label">Rôle</div><div class="value">${state.user.role === 'owner' ? 'Owner' : 'Membre'}</div></div>
      <div class="stat-card"><div class="label">Webhook Discord</div><div class="value">${state.savedWebhook ? 'Enregistré' : 'Aucun'}</div></div>
    </div>
  `;
  try{
    const data = await api('/sites/mine');
    document.querySelector('#ov-cards .stat-card .value.accent').textContent = (data.sites || []).length;
  } catch(e){
    document.querySelector('#ov-cards .stat-card .value.accent').textContent = '—';
  }
}

/* ---------- Lua / Dev tools : exécution réelle via Piston ---------- */
function renderCodeEditor(c, kind){
  const isLua = kind === 'lua';

  c.innerHTML = `
    <div class="content-header">
      <h2>${isLua ? 'Lua' : 'Dev Tools'}</h2>
      <p>${isLua ? "Écris ton script Lua et exécute-le pour de vrai." : "Exécute du Python ou du JavaScript pour de vrai, via l'API publique Piston."}</p>
    </div>
    ${!isLua ? `
      <div class="lang-tabs" id="lang-tabs">
        <div class="lang-tab active" data-lang="python">Python</div>
        <div class="lang-tab" data-lang="javascript">JavaScript</div>
      </div>
    ` : ''}
    <div class="editor-wrap">
      <div class="editor-pane">
        <div class="pane-bar">
          <span>Script</span>
          <div class="tools">
            <button class="pill-btn" id="dl-btn">Télécharger</button>
            <button class="pill-btn run" id="run-btn">Exécuter</button>
          </div>
        </div>
        <textarea class="code-input" id="code-input" spellcheck="false" placeholder="${isLua ? '-- écris ton script Lua ici' : '# écris ton script ici'}"></textarea>
      </div>
      <div class="console-pane">
        <div class="pane-bar">
          <span>Console</span>
          <div class="tools">
            <button class="pill-btn" id="copy-console">Copier</button>
            <button class="pill-btn" id="clear-console">Vider</button>
          </div>
        </div>
        <div class="console-body" id="console-body"><div class="sys">// La console s'affichera ici après exécution.</div></div>
      </div>
    </div>
    <div class="autocomplete-box" id="autocomplete"></div>
  `;

  let currentLang = isLua ? 'lua' : 'python';

  if(!isLua){
    c.querySelectorAll('#lang-tabs .lang-tab').forEach(el=>{
      el.onclick = ()=>{
        c.querySelectorAll('#lang-tabs .lang-tab').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        currentLang = el.dataset.lang;
      };
    });
  }

  const input = document.getElementById('code-input');
  const autoBox = document.getElementById('autocomplete');

  if(isLua){
    input.addEventListener('keyup', ()=>{
      const val = input.value;
      const pos = input.selectionStart;
      const before = val.slice(0, pos);
      const match = before.match(/[a-zA-Z_]+$/);
      if(match && match[0].length >= 2){
        const word = match[0];
        const sugg = LUA_KEYWORDS.filter(k => k.startsWith(word) && k !== word);
        if(sugg.length){
          autoBox.style.display = 'block';
          autoBox.style.left = '30px';
          autoBox.style.top = '46px';
          autoBox.innerHTML = sugg.slice(0,6).map(s => `<div class="autocomplete-item" data-word="${s}">${s}</div>`).join('');
          autoBox.querySelectorAll('.autocomplete-item').forEach(item=>{
            item.onclick = ()=>{
              const w = item.dataset.word;
              input.value = before.slice(0, before.length - word.length) + w + val.slice(pos);
              autoBox.style.display = 'none';
              input.focus();
            };
          });
          return;
        }
      }
      autoBox.style.display = 'none';
    });
    input.addEventListener('blur', ()=> setTimeout(()=> autoBox.style.display='none', 150));
  }

  document.getElementById('run-btn').onclick = async ()=>{
    const body = document.getElementById('console-body');
    const code = input.value;
    const runBtn = document.getElementById('run-btn');
    if(!code.trim()){
      body.innerHTML = `<div class="err">Erreur : aucun code à exécuter.</div>`;
      return;
    }
    runBtn.disabled = true;
    runBtn.innerHTML = '<span class="spinner"></span>';
    body.innerHTML = `<div class="sys">// Exécution en cours…</div>`;

    try{
      const langMap = { lua:'lua', python:'python', javascript:'javascript' };
      const piston_lang = langMap[currentLang];
      const res = await fetch('https://emkc.org/api/v2/piston/execute', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          language: piston_lang,
          version: '*',
          files: [{ content: code }]
        })
      });
      const data = await res.json();
      const out = (data.run && data.run.stdout) || '';
      const errOut = (data.run && data.run.stderr) || '';
      const compileErr = (data.compile && data.compile.stderr) || '';
      let html = '';
      if(out) html += `<div class="ok">${escapeHtml(out)}</div>`;
      if(compileErr) html += `<div class="err">${escapeHtml(compileErr)}</div>`;
      if(errOut) html += `<div class="err">${escapeHtml(errOut)}</div>`;
      if(!out && !errOut && !compileErr) html = `<div class="sys">// Aucune sortie.</div>`;
      body.innerHTML = html;
    } catch(e){
      body.innerHTML = `<div class="err">Erreur d'exécution : impossible de contacter l'API d'exécution (Piston). ${escapeHtml(e.message)}</div>`;
    } finally{
      runBtn.disabled = false;
      runBtn.textContent = 'Exécuter';
    }
  };

  document.getElementById('dl-btn').onclick = ()=>{
    const ext = isLua ? 'lua' : (currentLang === 'python' ? 'py' : 'js');
    const blob = new Blob([input.value], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `script.${ext}`;
    a.click();
  };

  document.getElementById('copy-console').onclick = ()=>{
    navigator.clipboard.writeText(document.getElementById('console-body').innerText);
    toast('Console copiée');
  };
  document.getElementById('clear-console').onclick = ()=>{
    document.getElementById('console-body').innerHTML = `<div class="sys">// Console vidée.</div>`;
  };
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- Hosting : réellement branché sur le Worker ---------- */
async function renderHosting(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Sites hébergés</h2>
      <p>Crée un mini-site HTML et reçois un lien réel, accessible depuis n'importe quel appareil.</p>
    </div>
    <div class="panel" style="margin-bottom:18px;">
      <div class="field" style="margin-bottom:10px;">
        <label>Nom du site</label>
        <input id="site-name" type="text" placeholder="mon-super-site">
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Code HTML</label>
        <textarea id="site-html" placeholder="<h1>Hello world</h1>" style="min-height:120px;"></textarea>
      </div>
      <button class="pill-btn run" id="publish-btn">Publier</button>
    </div>
    <div id="sites-list"><div class="empty-state">Chargement…</div></div>
  `;

  async function loadList(){
    const list = document.getElementById('sites-list');
    try{
      const data = await api('/sites/mine');
      const sites = data.sites || [];
      if(!sites.length){
        list.innerHTML = `<div class="empty-state"><div class="big">Aucun site publié</div>Crée ton premier site ci-dessus.</div>`;
        return;
      }
      list.innerHTML = sites.map(s => `
        <div class="site-row">
          <div>
            <div class="name">${escapeHtml(s.name)}</div>
            <div class="link">${API_BASE}/site/${s.id}</div>
          </div>
          <div class="actions">
            <button class="pill-btn" data-copy="${s.id}">Copier le lien</button>
            <button class="pill-btn danger" data-del="${s.id}">Supprimer</button>
          </div>
        </div>
      `).join('');
      list.querySelectorAll('[data-copy]').forEach(btn=>{
        btn.onclick = ()=>{
          navigator.clipboard.writeText(`${API_BASE}/site/${btn.dataset.copy}`);
          toast('Lien copié');
        };
      });
      list.querySelectorAll('[data-del]').forEach(btn=>{
        btn.onclick = async ()=>{
          try{
            await api('/sites/' + btn.dataset.del, { method:'DELETE' });
            toast('Site supprimé');
            loadList();
          } catch(e){ toast(e.message); }
        };
      });
    } catch(e){
      list.innerHTML = `<div class="empty-state"><div class="big" style="color:var(--red)">Impossible de charger tes sites</div>${escapeHtml(e.message)}</div>`;
    }
  }
  loadList();

  document.getElementById('publish-btn').onclick = async ()=>{
    const name = document.getElementById('site-name').value.trim();
    const html = document.getElementById('site-html').value;
    const btn = document.getElementById('publish-btn');
    if(!name){ toast('Donne un nom au site'); return; }
    if(!html.trim()){ toast('Le code HTML est vide'); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try{
      await api('/sites', { method:'POST', body:{ name, html } });
      document.getElementById('site-name').value = '';
      document.getElementById('site-html').value = '';
      toast('Site publié');
      loadList();
    } catch(e){
      toast(e.message);
    } finally{
      btn.disabled = false;
      btn.textContent = 'Publier';
    }
  };
}

/* ---------- Discord announce tool ---------- */
function renderDiscord(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Annonce Discord</h2>
      <p>Envoie un embed via un webhook Discord. Le webhook est sauvegardé pour la prochaine fois.</p>
    </div>
    <div class="panel" style="max-width:560px;">
      <div class="field">
        <label>Webhook Discord</label>
        <input id="wh-url" type="text" placeholder="https://discord.com/api/webhooks/..." value="${state.savedWebhook}">
      </div>
      <div class="field">
        <label>Titre de l'embed</label>
        <input id="embed-title" type="text" placeholder="Titre de l'annonce">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="embed-desc" placeholder="Contenu de l'annonce..."></textarea>
      </div>
      <button class="pill-btn run" id="send-btn">Envoyer l'annonce</button>
      <div class="embed-preview" id="preview" style="display:none;">
        <div class="etitle" id="pv-title"></div>
        <div class="edesc" id="pv-desc"></div>
      </div>
    </div>
  `;

  const titleI = document.getElementById('embed-title');
  const descI = document.getElementById('embed-desc');
  function updatePreview(){
    const t = titleI.value, d = descI.value;
    if(!t && !d){ document.getElementById('preview').style.display='none'; return; }
    document.getElementById('preview').style.display='block';
    document.getElementById('pv-title').textContent = t;
    document.getElementById('pv-desc').textContent = d;
  }
  titleI.oninput = updatePreview;
  descI.oninput = updatePreview;

  document.getElementById('send-btn').onclick = async ()=>{
    const url = document.getElementById('wh-url').value.trim();
    const title = titleI.value.trim();
    const desc = descI.value.trim();
    const btn = document.getElementById('send-btn');
    if(!url){ toast('Colle un lien de webhook'); return; }
    if(!title && !desc){ toast("Ajoute un titre ou une description"); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try{
      const res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ embeds:[{ title, description:desc, color: 6216447 }] })
      });
      if(!res.ok) throw new Error('Discord a refusé la requête (lien invalide ?)');
      localStorage.setItem('forge_webhook', url);
      state.savedWebhook = url;
      toast('Annonce envoyée');
    } catch(e){
      toast(e.message);
    } finally{
      btn.disabled = false;
      btn.textContent = "Envoyer l'annonce";
    }
  };
}

function renderSettings(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Paramètres</h2>
      <p>Gère ton compte et tes préférences.</p>
    </div>
    <div class="settings-section">

      <div class="panel" style="max-width:420px;">
        <div class="field">
          <label>Mot de passe actuel</label>
          <input id="cur-pass" type="password">
        </div>
        <div class="field">
          <label>Nouveau mot de passe</label>
          <input id="new-pass" type="password">
        </div>
        <button class="pill-btn run" id="change-pass-btn">Mettre à jour</button>
      </div>
    </div>
    <div class="settings-section">
      <h3>Webhook Discord enregistré</h3>
      <div class="panel" style="max-width:420px;">
        <div class="field" style="margin-bottom:12px;">
          <input id="wh-set" type="text" value="${state.savedWebhook}" placeholder="Aucun webhook enregistré">
        </div>
        <button class="pill-btn danger" id="clear-wh-btn">Supprimer le webhook enregistré</button>
      </div>
    </div>
  `;

  document.getElementById('change-pass-btn').onclick = async ()=>{
    const cur = document.getElementById('cur-pass').value;
    const neu = document.getElementById('new-pass').value;
    if(!cur || !neu){ toast('Remplis les deux champs'); return; }
    try{
      await api('/auth/change-password', { method:'POST', body:{ current:cur, next:neu } });
      toast('Mot de passe mis à jour');
      document.getElementById('cur-pass').value = '';
      document.getElementById('new-pass').value = '';
    } catch(e){ toast(e.message); }
  };

  document.getElementById('clear-wh-btn').onclick = ()=>{
    localStorage.removeItem('forge_webhook');
    state.savedWebhook = '';
    document.getElementById('wh-set').value = '';
    toast('Webhook oublié');
  };
}
