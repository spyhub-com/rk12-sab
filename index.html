<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legacy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#06060f;
  --s1:rgba(255,255,255,0.03);
  --s2:rgba(255,255,255,0.055);
  --b:rgba(255,255,255,0.07);
  --b2:rgba(160,100,255,0.22);
  --p1:#a78bfa;
  --p2:#7c3aed;
  --p3:#c4b5fd;
  --tx:#ede9fe;
  --mt:rgba(237,233,254,0.42);
  --red:#f87171;
  --grn:#34d399;
}

body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}

/* dotted grid background */
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(160,100,255,0.18) 1px,transparent 1px);
  background-size:28px 28px;
  pointer-events:none;z-index:0;opacity:.6;
}
body::after{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 15% 5%,rgba(109,40,217,0.22) 0%,transparent 65%),
    radial-gradient(ellipse 55% 45% at 85% 85%,rgba(167,139,250,0.12) 0%,transparent 60%);
  pointer-events:none;z-index:0;
}

#app{position:relative;z-index:1}

/* ── AUTH ── */
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

.auth-card{
  width:100%;max-width:400px;
  background:rgba(13,10,28,0.72);
  border:1px solid var(--b2);
  border-radius:20px;
  padding:44px 36px;
  backdrop-filter:blur(48px);
  box-shadow:0 0 0 1px rgba(124,58,237,0.08),0 40px 80px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.06);
}

.auth-wordmark{text-align:center;margin-bottom:36px}
.auth-wordmark h1{font-size:20px;font-weight:600;letter-spacing:-.2px;color:var(--tx)}
.auth-wordmark p{color:var(--mt);font-size:13px;margin-top:5px}
.auth-wordmark .line{width:32px;height:2px;background:linear-gradient(90deg,var(--p2),var(--p1));border-radius:1px;margin:12px auto 0}

.tab-switch{display:flex;background:var(--s1);border:1px solid var(--b);border-radius:10px;padding:3px;margin-bottom:24px}
.tab-btn{flex:1;padding:9px;background:none;border:none;color:var(--mt);font-size:13px;font-weight:500;cursor:pointer;border-radius:8px;transition:all .18s;font-family:inherit}
.tab-btn.active{background:rgba(124,58,237,0.35);color:var(--p3);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08)}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:500;color:var(--mt);margin-bottom:7px;letter-spacing:.4px;text-transform:uppercase}
.field input{
  width:100%;padding:11px 14px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--b);
  border-radius:10px;color:var(--tx);
  font-size:14px;font-family:inherit;
  transition:border-color .18s,box-shadow .18s;outline:none;
}
.field input:focus{border-color:rgba(124,58,237,0.6);box-shadow:0 0 0 3px rgba(124,58,237,0.12)}
.field input::placeholder{color:rgba(237,233,254,0.22)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border:none;border-radius:10px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .18s;white-space:nowrap}
.btn-primary{width:100%;background:linear-gradient(135deg,var(--p2),#5b21b6);color:#fff;box-shadow:0 4px 18px rgba(109,40,217,0.3);margin-top:6px}
.btn-primary:hover{box-shadow:0 6px 24px rgba(109,40,217,0.42);transform:translateY(-1px)}
.btn-primary:active{transform:none}
.btn-ghost{background:var(--s1);border:1px solid var(--b);color:var(--tx)}
.btn-ghost:hover{background:var(--s2);border-color:var(--b2)}
.btn-red{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);color:var(--red)}
.btn-red:hover{background:rgba(248,113,113,0.18)}
.btn-grn{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);color:var(--grn)}
.btn-grn:hover{background:rgba(52,211,153,0.18)}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:8px}

.msg{margin-top:14px;padding:11px 14px;border-radius:9px;font-size:12px;font-weight:500;display:none}
.msg.error{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);color:var(--red)}
.msg.success{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);color:var(--grn)}
.msg.show{display:block}

/* ── TOPBAR ── */
#dashboard-screen{display:none;min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:58px;
  background:rgba(6,6,15,0.82);
  border-bottom:1px solid var(--b);
  backdrop-filter:blur(24px);
}
.topbar-brand{font-size:15px;font-weight:600;color:var(--tx);letter-spacing:-.1px;display:flex;align-items:center;gap:10px}
.topbar-brand .pip{width:6px;height:6px;background:var(--grn);border-radius:50%;box-shadow:0 0 7px var(--grn)}
.topbar-r{display:flex;align-items:center;gap:10px}

.badge{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.3px}
.badge-owner{background:rgba(167,139,250,0.14);border:1px solid rgba(167,139,250,0.3);color:var(--p3)}
.badge-admin{background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.28);color:var(--p1)}

/* ── MAIN ── */
.main{padding:28px;max-width:1100px;margin:0 auto}

.nav-tabs{display:flex;gap:2px;margin-bottom:28px;background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:4px;width:fit-content}
.nav-tab{padding:8px 18px;background:none;border:none;color:var(--mt);font-size:13px;font-weight:500;cursor:pointer;border-radius:9px;transition:all .18s;font-family:inherit}
.nav-tab.active{background:rgba(124,58,237,0.3);color:var(--p3)}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px}
.stat-card{
  background:rgba(13,10,28,0.5);
  border:1px solid var(--b);
  border-radius:15px;padding:22px;
  backdrop-filter:blur(16px);
  position:relative;overflow:hidden;
  transition:border-color .2s,transform .2s;
}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,0.35),transparent)}
.stat-card:hover{border-color:var(--b2);transform:translateY(-2px)}
.stat-lbl{font-size:10px;font-weight:500;color:var(--mt);text-transform:uppercase;letter-spacing:.9px;margin-bottom:10px}
.stat-val{font-size:32px;font-weight:600;letter-spacing:-1px;color:var(--p3);line-height:1}

/* ── TABLES ── */
.section-hd{font-size:13px;font-weight:500;color:var(--tx);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cnt{font-size:11px;padding:2px 9px;background:var(--s2);border-radius:20px;color:var(--mt)}

.gt{width:100%;background:rgba(13,10,28,0.45);border:1px solid var(--b);border-radius:14px;overflow:hidden;backdrop-filter:blur(16px);margin-bottom:24px}
.gt table{width:100%;border-collapse:collapse}
.gt thead th{padding:12px 18px;text-align:left;font-size:10px;font-weight:500;color:var(--mt);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--b);background:rgba(255,255,255,0.015)}
.gt tbody td{padding:12px 18px;font-size:13px;color:var(--tx);border-bottom:1px solid rgba(255,255,255,0.035)}
.gt tbody tr:last-child td{border-bottom:none}
.gt tbody tr:hover td{background:rgba(167,139,250,0.04)}

.uid{font-family:'Courier New',monospace;font-size:11px;color:var(--p1);background:rgba(124,58,237,0.1);padding:3px 7px;border-radius:5px}
.muted{color:var(--mt);font-size:12px}

/* ── BAN FORM ── */
.ban-box{background:rgba(13,10,28,0.45);border:1px solid var(--b);border-radius:15px;padding:24px;backdrop-filter:blur(16px);margin-bottom:24px}
.form-row{display:flex;gap:10px;align-items:flex-end}
.form-row .field{flex:1;margin-bottom:0}
.form-row .btn{flex-shrink:0;padding:11px 18px}

/* ── REFRESH BAR ── */
.rbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.rbar-lbl{font-size:12px;color:var(--mt)}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(--mt);font-size:13px}

/* ── TOAST ── */
#toast{position:fixed;bottom:28px;right:28px;padding:13px 18px;border-radius:12px;font-size:13px;font-weight:500;backdrop-filter:blur(20px);z-index:9999;transform:translateY(70px);opacity:0;transition:all .28s cubic-bezier(.34,1.56,.64,1);max-width:300px;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{background:rgba(52,211,153,0.13);border:1px solid rgba(52,211,153,0.3);color:var(--grn)}
#toast.error{background:rgba(248,113,113,0.13);border:1px solid rgba(248,113,113,0.3);color:var(--red)}

/* ── SPINNER ── */
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,0.15);border-top-color:rgba(255,255,255,0.6);border-radius:50%;animation:sp .65s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── BUTTON WRAP style (inspired by reference) ── */
.btn-wrap{position:relative;display:inline-block}
.btn-wrap .btn-shadow{position:absolute;bottom:-3px;left:2px;right:-2px;height:100%;background:rgba(109,40,217,0.3);border-radius:10px;z-index:-1;filter:blur(6px)}

@media(max-width:640px){
  .topbar{padding:0 16px}
  .main{padding:16px}
  .auth-card{padding:30px 20px}
  .form-row{flex-direction:column}
  .form-row .btn{width:100%}
  .stats-grid{grid-template-columns:1fr 1fr}
  #toast{bottom:14px;right:14px;left:14px;max-width:none}
  .nav-tabs{overflow-x:auto;width:100%}
}
</style>
</head>
<body>
<div id="app">

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-wordmark">
      <h1>Legacy</h1>
      <p>Panneau de contrôle</p>
      <div class="line"></div>
    </div>
    <div class="tab-switch">
      <button class="tab-btn active" onclick="switchAuthTab('login')">Connexion</button>
      <button class="tab-btn" onclick="switchAuthTab('register')">Créer un compte</button>
    </div>
    <div id="form-login">
      <div class="field"><label>Identifiant</label><input type="text" id="lu" placeholder="admin" autocomplete="username"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="lp" placeholder="••••••••" autocomplete="current-password"></div>
      <div class="btn-wrap"><button class="btn btn-primary" onclick="doLogin()">Se connecter</button><div class="btn-shadow"></div></div>
      <div class="msg" id="lmsg"></div>
    </div>
    <div id="form-register" style="display:none">
      <div class="field"><label>Identifiant</label><input type="text" id="ru" placeholder="monpseudo" autocomplete="username"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="rp" placeholder="Min. 6 caractères" autocomplete="new-password"></div>
      <div class="btn-wrap"><button class="btn btn-primary" onclick="doRegister()">Créer le compte</button><div class="btn-shadow"></div></div>
      <div class="msg" id="rmsg"></div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-screen">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="pip"></div>
      Legacy
    </div>
    <div class="topbar-r">
      <span class="badge" id="role-badge"></span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Déconnexion</button>
    </div>
  </div>

  <div class="main">
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('stats',this)">Statistiques</button>
      <button class="nav-tab" onclick="switchTab('players',this)">Joueurs</button>
      <button class="nav-tab" onclick="switchTab('bans',this)">Bans</button>
      <button class="nav-tab owner-only" onclick="switchTab('accounts',this)" style="display:none">Comptes</button>
    </div>

    <!-- Stats -->
    <div id="tab-stats" class="tab-content active">
      <div class="rbar">
        <div class="section-hd">Vue d'ensemble</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="rbar-lbl" id="last-upd"></span>
          <button class="btn btn-ghost btn-sm" onclick="loadStats()">Actualiser</button>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-lbl">Exécutions</div><div class="stat-val" id="s-total">—</div></div>
        <div class="stat-card"><div class="stat-lbl">Joueurs uniques</div><div class="stat-val" id="s-players">—</div></div>
        <div class="stat-card"><div class="stat-lbl">Bannis</div><div class="stat-val" id="s-bans">—</div></div>
      </div>
      <div class="section-hd">Activité récente</div>
      <div class="gt"><table>
        <thead><tr><th>Joueur</th><th>User ID</th><th>Place ID</th><th>Date</th></tr></thead>
        <tbody id="recent-tb"><tr><td colspan="4"><div class="empty"><div class="spin"></div></div></td></tr></tbody>
      </table></div>
    </div>

    <!-- Players -->
    <div id="tab-players" class="tab-content">
      <div class="section-hd">Top joueurs <span class="cnt" id="pl-cnt">0</span></div>
      <div class="gt"><table>
        <thead><tr><th>Joueur</th><th>User ID</th><th>Exécutions</th><th>Dernière activité</th><th>Action</th></tr></thead>
        <tbody id="players-tb"><tr><td colspan="5"><div class="empty"><div class="spin"></div></div></td></tr></tbody>
      </table></div>
    </div>

    <!-- Bans -->
    <div id="tab-bans" class="tab-content">
      <div class="ban-box">
        <div class="section-hd" style="margin-bottom:16px">Bannir un joueur</div>
        <div class="form-row">
          <div class="field"><label>User ID Roblox</label><input type="text" id="ban-uid" placeholder="123456789"></div>
          <div class="field"><label>Raison</label><input type="text" id="ban-rsn" placeholder="Exploit, cheat..."></div>
          <button class="btn btn-red" onclick="doBan()">Bannir</button>
        </div>
      </div>
      <div class="section-hd">Bannis actifs <span class="cnt" id="bn-cnt">0</span></div>
      <div class="gt"><table>
        <thead><tr><th>User ID</th><th>Raison</th><th>Date</th><th>Par</th><th>Action</th></tr></thead>
        <tbody id="bans-tb"><tr><td colspan="5"><div class="empty"><div class="spin"></div></div></td></tr></tbody>
      </table></div>
    </div>

    <!-- Accounts -->
    <div id="tab-accounts" class="tab-content">
      <div class="section-hd">Comptes</div>
      <div class="gt"><table>
        <thead><tr><th>Identifiant</th><th>Rôle</th><th>Créé le</th><th>Actions</th></tr></thead>
        <tbody id="acc-tb"><tr><td colspan="4"><div class="empty"><div class="spin"></div></div></td></tr></tbody>
      </table></div>
    </div>
  </div>
</div>
</div>

<div id="toast"></div>

<script>
const W="https://legacy.spyuhq.workers.dev";
let token=localStorage.getItem("sh_t")||null;
let me=localStorage.getItem("sh_u")||null;
let role=localStorage.getItem("sh_r")||null;
let cache=null;

token?( showDash(), loadStats() ) : (document.getElementById("auth-screen").style.display="flex");

function switchAuthTab(t){
  document.getElementById("form-login").style.display=t==="login"?"block":"none";
  document.getElementById("form-register").style.display=t==="register"?"block":"none";
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active",(i===0&&t==="login")||(i===1&&t==="register")));
}

async function doLogin(){
  const u=document.getElementById("lu").value.trim(),p=document.getElementById("lp").value,m=document.getElementById("lmsg");
  if(!u||!p){showMsg(m,"error","Remplis tous les champs");return}
  try{
    const r=await fetch(`${W}/api/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(!d.success){showMsg(m,"error",d.error||"Erreur");return}
    save(d.token,d.username,d.role);showDash();loadStats();
  }catch(e){showMsg(m,"error","Serveur inaccessible")}
}

async function doRegister(){
  const u=document.getElementById("ru").value.trim(),p=document.getElementById("rp").value,m=document.getElementById("rmsg");
  if(!u||!p){showMsg(m,"error","Remplis tous les champs");return}
  try{
    const r=await fetch(`${W}/api/register`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(!d.success){showMsg(m,"error",d.error||"Erreur");return}
    if(d.token){save(d.token,d.username||u,d.role);showDash();loadStats();}
    else showMsg(m,"success",d.message||"Compte créé, en attente d'activation");
  }catch(e){showMsg(m,"error","Serveur inaccessible")}
}

function save(t,u,r){
  token=t;me=u;role=r;
  localStorage.setItem("sh_t",t);localStorage.setItem("sh_u",u);localStorage.setItem("sh_r",r);
}

function doLogout(){
  token=me=role=null;
  ["sh_t","sh_u","sh_r"].forEach(k=>localStorage.removeItem(k));
  document.getElementById("dashboard-screen").style.display="none";
  document.getElementById("auth-screen").style.display="flex";
}

function showDash(){
  document.getElementById("auth-screen").style.display="none";
  document.getElementById("dashboard-screen").style.display="block";
  const b=document.getElementById("role-badge");
  b.textContent=role==="owner"?"Owner":"Admin";
  b.className="badge "+(role==="owner"?"badge-owner":"badge-admin");
  document.querySelectorAll(".owner-only").forEach(el=>el.style.display=role==="owner"?"":"none");
}

function switchTab(name,el){
  document.querySelectorAll(".tab-content").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".nav-tab").forEach(x=>x.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
  el.classList.add("active");
  if(name==="accounts"&&role==="owner")loadAccounts();
}

async function api(path,method="GET",body=null){
  const opts={method,headers:{"Content-Type":"application/json","Authorization":`Bearer ${token}`}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(`${W}${path}`,opts);
  if(r.status===401){doLogout();throw new Error("Session expirée")}
  return r.json();
}

async function loadStats(){
  try{
    const d=await api("/api/stats");cache=d;
    document.getElementById("s-total").textContent=(d.totalExecutions||0).toLocaleString();
    document.getElementById("s-players").textContent=(d.uniquePlayers||0).toLocaleString();
    document.getElementById("s-bans").textContent=(d.bannedCount||0).toLocaleString();
    document.getElementById("last-upd").textContent="Mis à jour "+new Date().toLocaleTimeString("fr-FR");
    renderRecent(d.recentExecutions||[]);
    renderPlayers(d.topPlayers||[]);
    renderBans(d.bans||{});
  }catch(e){toast("Erreur de chargement","error")}
}

function renderRecent(ex){
  const tb=document.getElementById("recent-tb");
  if(!ex.length){tb.innerHTML=`<tr><td colspan="4"><div class="empty">Aucune exécution</div></td></tr>`;return}
  tb.innerHTML=ex.map(e=>`<tr>
    <td><strong>${esc(e.username||"inconnu")}</strong></td>
    <td><span class="uid">${esc(e.userId)}</span></td>
    <td><span class="uid">${esc(e.placeId||"—")}</span></td>
    <td><span class="muted">${fd(e.timestamp)}</span></td>
  </tr>`).join("");
}

function renderPlayers(pl){
  document.getElementById("pl-cnt").textContent=pl.length;
  const tb=document.getElementById("players-tb");
  if(!pl.length){tb.innerHTML=`<tr><td colspan="5"><div class="empty">Aucun joueur</div></td></tr>`;return}
  tb.innerHTML=pl.map(p=>`<tr>
    <td><strong>${esc(p.username||"inconnu")}</strong></td>
    <td><span class="uid">${esc(p.userId)}</span></td>
    <td><strong>${p.count}</strong></td>
    <td><span class="muted">${fd(p.lastSeen)}</span></td>
    <td>${cache?.bans?.[p.userId]
      ?`<button class="btn btn-grn btn-sm" onclick="doUnban('${esc(p.userId)}')">Débannir</button>`
      :`<button class="btn btn-red btn-sm" onclick="prefillBan('${esc(p.userId)}')">Bannir</button>`
    }</td>
  </tr>`).join("");
}

function renderBans(bans){
  const entries=Object.entries(bans);
  document.getElementById("bn-cnt").textContent=entries.length;
  const tb=document.getElementById("bans-tb");
  if(!entries.length){tb.innerHTML=`<tr><td colspan="5"><div class="empty">Aucun joueur banni</div></td></tr>`;return}
  tb.innerHTML=entries.map(([uid,b])=>`<tr>
    <td><span class="uid">${esc(uid)}</span></td>
    <td>${esc(b.reason||"—")}</td>
    <td><span class="muted">${fd(b.bannedAt)}</span></td>
    <td>${esc(b.bannedBy||"—")}</td>
    <td><button class="btn btn-grn btn-sm" onclick="doUnban('${esc(uid)}')">Débannir</button></td>
  </tr>`).join("");
}

function prefillBan(uid){
  document.getElementById("ban-uid").value=uid;
  document.querySelector("[onclick*=\"switchTab('bans'\"]").click();
  document.getElementById("ban-uid").focus();
}

async function doBan(){
  const uid=document.getElementById("ban-uid").value.trim();
  const rsn=document.getElementById("ban-rsn").value.trim();
  if(!uid){toast("Entre un User ID","error");return}
  try{
    const d=await api("/api/ban","POST",{userId:uid,reason:rsn});
    if(!d.success){toast(d.error||"Erreur","error");return}
    toast(`Joueur ${uid} banni`,"success");
    document.getElementById("ban-uid").value="";document.getElementById("ban-rsn").value="";
    await loadStats();
  }catch(e){toast("Erreur serveur","error")}
}

async function doUnban(uid){
  try{
    const d=await api("/api/unban","POST",{userId:uid});
    if(!d.success){toast(d.error||"Erreur","error");return}
    toast(`Joueur ${uid} débanni`,"success");await loadStats();
  }catch(e){toast("Erreur","error")}
}

async function loadAccounts(){
  try{
    const d=await api("/api/accounts");
    const tb=document.getElementById("acc-tb");
    if(!d.accounts?.length){tb.innerHTML=`<tr><td colspan="4"><div class="empty">Aucun compte</div></td></tr>`;return}
    tb.innerHTML=d.accounts.map(a=>`<tr>
      <td><strong>${esc(a.username)}</strong></td>
      <td><span class="badge ${a.role==="owner"?"badge-owner":a.role==="pending"?"":"badge-admin"}">${a.role==="owner"?"Owner":a.role==="pending"?"En attente":"Admin"}</span></td>
      <td><span class="muted">${fd(a.createdAt)}</span></td>
      <td style="display:flex;gap:6px;flex-wrap:wrap">
        ${a.role==="pending"?`<button class="btn btn-grn btn-sm" onclick="approveAcc('${esc(a.username)}')">Activer</button>`:""}
        ${a.role!=="owner"?`<button class="btn btn-red btn-sm" onclick="deleteAcc('${esc(a.username)}')">Supprimer</button>`:""}
      </td>
    </tr>`).join("");
  }catch(e){toast("Erreur comptes","error")}
}

async function approveAcc(u){
  const d=await api("/api/accounts/approve","POST",{username:u});
  if(d.success){toast(`${u} est admin`,"success");loadAccounts();}else toast(d.error,"error");
}

async function deleteAcc(u){
  if(!confirm(`Supprimer "${u}" ?`))return;
  const d=await api("/api/accounts/delete","POST",{username:u});
  if(d.success){toast(`${u} supprimé`,"success");loadAccounts();}else toast(d.error,"error");
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fd(ts){if(!ts)return"—";return new Date(ts).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}

function showMsg(el,type,text){el.className=`msg ${type} show`;el.textContent=text}

let tt;
function toast(text,type="success"){
  const el=document.getElementById("toast");
  el.textContent=text;el.className=`show ${type}`;
  clearTimeout(tt);tt=setTimeout(()=>{el.className=""},3000);
}

document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&document.getElementById("auth-screen").style.display!=="none"){
    const loginVisible=document.getElementById("form-login").style.display!=="none";
    if(loginVisible)doLogin();else doRegister();
  }
});
</script>
</body>
</html>
