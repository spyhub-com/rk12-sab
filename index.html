<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SpyHub Gen Tools</title>
<style>
  :root{
    --bg:#0A0A0B;
    --glass:rgba(255,255,255,0.045);
    --border:rgba(255,255,255,0.10);
    --border-soft:rgba(255,255,255,0.06);
    --text:#F2F2F3;
    --text-dim:#9A9AA0;
    --text-faint:#5C5C62;
    --accent:#B8B8BE;       /* gris clair neutre par défaut */
    --accent-2:#7A7A80;     /* dégradé secondaire par défaut */
    --accent-text:#0A0A0B;
    --red:#FF6B6B;
    --green:#5FD98A;
    --radius:18px;
    --radius-sm:12px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--bg); color:var(--text); min-height:100%; -webkit-font-smoothing:antialiased; overflow-y:auto; overflow-x:hidden; }
  body{ background-image:
      radial-gradient(circle at 12% 15%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 45%),
      radial-gradient(circle at 88% 82%, color-mix(in srgb, var(--accent-2) 8%, transparent), transparent 50%); }
  #app{ min-height:100vh; width:100vw; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ---- Login ---- */
  .login-wrap{ min-height:100%; width:100%; display:flex; align-items:center; justify-content:center; padding:20px; padding-top:80px; overflow-y:auto; }
  .login-card{ width:100%; max-width:380px; padding:36px 32px; background:var(--glass); border:1px solid var(--border);
    border-radius:24px; backdrop-filter:blur(30px) saturate(160%); -webkit-backdrop-filter:blur(30px) saturate(160%);
    box-shadow:0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    animation:riseIn .5s cubic-bezier(.16,1,.3,1); }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(14px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .login-mark{ width:44px; height:44px; border-radius:13px; background:linear-gradient(155deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; margin-bottom:20px; color:var(--accent-text); }
  .login-card h1{ font-size:21px; font-weight:600; letter-spacing:-0.01em; margin-bottom:6px; }
  .login-card p.sub{ color:var(--text-dim); font-size:13.5px; margin-bottom:26px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:7px; font-weight:500; }
  .field input, .field textarea{ width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border-soft);
    border-radius:11px; padding:12px 14px; color:var(--text); font-size:14.5px; outline:none;
    transition:border-color .15s, background .15s; font-family:inherit; }
  .field input:focus, .field textarea:focus{ border-color:rgba(184,184,190,0.55); border-color:color-mix(in srgb, var(--accent) 55%, transparent); background:rgba(255,255,255,0.06); }
  .btn-primary{ width:100%; background:linear-gradient(120deg, var(--accent), var(--accent-2)); color:var(--accent-text);
    border:none; border-radius:11px; padding:12px 0; font-size:14.5px; font-weight:600; cursor:pointer; margin-top:8px;
    transition:filter .15s, transform .1s; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .login-toggle{ text-align:center; margin-top:18px; font-size:13.5px; color:var(--text-dim); }
  .login-toggle span{ color:var(--text); text-decoration:underline; cursor:pointer; }
  .login-error{ color:var(--red); font-size:13px; margin-top:10px; display:none; }
  .login-note{ color:var(--text-faint); font-size:11.5px; margin-top:14px; text-align:center; }

  /* ---- Topbar (mobile-first) ---- */
  .topbar{
    height:56px; flex-shrink:0;
    display:flex; align-items:center; gap:12px;
    padding:0 16px;
    border-bottom:1px solid var(--border-soft);
    background:rgba(255,255,255,0.02);
    backdrop-filter:blur(20px);
  }
  .hamburger{
    width:34px; height:34px; border-radius:9px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    cursor:pointer; background:rgba(255,255,255,0.04); border:1px solid var(--border-soft);
    flex-shrink:0;
  }
  .hamburger span{ width:15px; height:1.5px; background:var(--text); border-radius:2px; }
  .topbar-title{ font-size:15px; font-weight:600; letter-spacing:-0.01em; flex:1; }
  .topbar .mark{ width:26px; height:26px; border-radius:8px; background:linear-gradient(155deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--accent-text); flex-shrink:0; }
  .topbar .avatar-sm{ width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.06); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:600; color:var(--text-dim); flex-shrink:0; }

  /* ---- Layout ---- */
  .main-layout{ display:flex; flex-direction:column; min-height:100vh; width:100%; }
  .body-row{ display:flex; flex:1; overflow:hidden; position:relative; }

  .sidebar-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:90;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .sidebar-overlay.show{ opacity:1; pointer-events:auto; }

  .sidebar{
    width:250px; flex-shrink:0; background:rgba(12,12,14,0.98); border-right:1px solid var(--border-soft);
    display:flex; flex-direction:column; padding:16px 12px;
    position:fixed; top:0; left:0; bottom:0; z-index:95;
    transform:translateX(-100%); transition:transform .25s cubic-bezier(.16,1,.3,1);
    backdrop-filter:blur(20px);
  }
  .sidebar.open{ transform:translateX(0); }
  @media (min-width:860px){
    .sidebar{ position:static; transform:none; background:rgba(255,255,255,0.02); }
    .sidebar-overlay{ display:none; }
    .hamburger{ display:none; }
  }

  .sidebar-close{ display:flex; justify-content:flex-end; padding:4px 4px 10px 4px; }
  @media (min-width:860px){ .sidebar-close{ display:none; } }

  .nav-group{ margin-bottom:16px; }
  .nav-label{ font-size:11px; color:var(--text-faint); padding:0 10px; margin-bottom:6px; font-weight:600; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:9px; color:var(--text-dim);
    font-size:14px; cursor:pointer; transition:background .12s, color .12s; user-select:none; }
  .nav-item:hover{ background:rgba(255,255,255,0.045); color:var(--text); }
  .nav-item.active{ background:rgba(184,184,190,0.16); background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--text); }
  .nav-item .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0.5; flex-shrink:0; }
  .nav-item.active .dot{ background:var(--accent); opacity:1; }
  .sidebar-footer{ margin-top:auto; border-top:1px solid var(--border-soft); padding-top:14px; display:flex;
    align-items:center; gap:10px; padding-left:8px; }
  .avatar{ width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:var(--text-dim);
    border:1px solid var(--border); flex-shrink:0; }
  .user-meta{ line-height:1.25; overflow:hidden; }
  .user-meta .uname{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-meta .urole{ font-size:11.5px; color:var(--text-faint); }
  .logout-btn{ margin-left:auto; color:var(--text-faint); cursor:pointer; font-size:12px; flex-shrink:0; }
  .logout-btn:hover{ color:var(--red); }

  .content{ flex:1; overflow-y:auto; padding:22px 18px; }
  @media (min-width:860px){ .content{ padding:34px 42px; } }
  .content-header{ margin-bottom:22px; }
  .content-header h2{ font-size:21px; font-weight:600; letter-spacing:-0.015em; margin-bottom:5px; }
  .content-header p{ color:var(--text-dim); font-size:13.5px; max-width:560px; }

  .panel{ background:var(--glass); border:1px solid var(--border); border-radius:var(--radius);
    backdrop-filter:blur(20px) saturate(140%); -webkit-backdrop-filter:blur(20px) saturate(140%); padding:18px; }
  @media (min-width:860px){ .panel{ padding:22px; } }

  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; margin-top:6px; }
  @media (min-width:860px){ .grid-cards{ grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; } }
  .stat-card{ background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px; }
  .stat-card .label{ font-size:12px; color:var(--text-dim); margin-bottom:8px; }
  .stat-card .value{ font-size:22px; font-weight:600; letter-spacing:-0.02em; }
  .stat-card .value.accent{ color:var(--accent); }

  .editor-wrap{ display:flex; flex-direction:column; gap:12px; }
  @media (min-width:860px){ .editor-wrap{ flex-direction:row; height:calc(100vh - 210px); } }
  .editor-pane, .console-pane{ flex:1; background:var(--glass); border:1px solid var(--border); border-radius:var(--radius);
    display:flex; flex-direction:column; overflow:hidden; min-height:220px; }
  .pane-bar{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px;
    border-bottom:1px solid var(--border-soft); font-size:12px; color:var(--text-dim); }
  .pane-bar .tools{ display:flex; gap:8px; }
  .pill-btn{ background:rgba(255,255,255,0.05); border:1px solid var(--border-soft); color:var(--text-dim);
    font-size:12px; padding:6px 11px; border-radius:8px; cursor:pointer; transition:background .12s, color .12s; }
  .pill-btn:hover{ background:rgba(255,255,255,0.09); color:var(--text); }
  .pill-btn.run{ background:linear-gradient(120deg, var(--accent), var(--accent-2)); color:var(--accent-text); border:none; font-weight:600; }
  .pill-btn.run:hover{ filter:brightness(1.08); }
  .pill-btn.run:disabled{ opacity:0.5; cursor:not-allowed; }
  .pill-btn.danger:hover{ color:var(--red); }

  textarea.code-input{ flex:1; background:transparent; border:none; outline:none; resize:none; color:var(--text);
    font-family:"SF Mono", Menlo, Consolas, monospace; font-size:13px; line-height:1.6; padding:14px; min-height:160px; }
  .console-body{ flex:1; padding:14px; font-family:"SF Mono", Menlo, Consolas, monospace; font-size:12.5px;
    line-height:1.7; overflow-y:auto; color:var(--text-dim); white-space:pre-wrap; }
  .console-body .err{ color:var(--red); }
  .console-body .ok{ color:var(--green); }
  .console-body .sys{ color:var(--text-faint); }

  .autocomplete-box{ position:absolute; background:rgba(20,20,22,0.97); border:1px solid var(--border); border-radius:9px;
    padding:5px; font-family:"SF Mono", Menlo, Consolas, monospace; font-size:13px; backdrop-filter:blur(20px);
    box-shadow:0 12px 30px rgba(0,0,0,0.5); display:none; z-index:50; }
  .autocomplete-item{ padding:6px 10px; border-radius:6px; cursor:pointer; color:var(--text-dim); }
  .autocomplete-item:hover, .autocomplete-item.sel{ background:rgba(184,184,190,0.18); background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--text); }

  .lang-tabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .lang-tab{ padding:7px 14px; border-radius:9px; background:rgba(255,255,255,0.04); border:1px solid var(--border-soft);
    font-size:13px; color:var(--text-dim); cursor:pointer; }
  .lang-tab.active{ background:rgba(184,184,190,0.18); background:color-mix(in srgb, var(--accent) 18%, transparent); color:var(--text); border-color:rgba(184,184,190,0.35); border-color:color-mix(in srgb, var(--accent) 35%, transparent); }

  .site-row{ display:flex; align-items:center; justify-content:space-between; padding:14px; border-radius:12px;
    background:rgba(255,255,255,0.03); border:1px solid var(--border-soft); margin-bottom:10px; gap:12px; flex-wrap:wrap; }
  .site-row .link{ color:var(--text); opacity:0.8; font-size:13px; font-family:"SF Mono", Menlo, monospace; word-break:break-all; }
  .site-row .name{ font-size:14px; font-weight:500; margin-bottom:3px; }
  .site-row .actions{ display:flex; gap:8px; flex-shrink:0; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-faint); }
  .empty-state .big{ font-size:15px; color:var(--text-dim); margin-bottom:4px; }

  .embed-preview{ border-left:3px solid var(--accent); background:rgba(255,255,255,0.03); border-radius:8px;
    padding:14px 16px; margin-top:16px; }
  .embed-preview .etitle{ font-weight:600; font-size:14.5px; margin-bottom:6px; color:#fff; }
  .embed-preview .edesc{ font-size:13.5px; color:#dcdde0; line-height:1.5; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(20,20,22,0.95); border:1px solid var(--border); padding:12px 20px; border-radius:12px;
    font-size:13.5px; backdrop-filter:blur(20px); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    z-index:200; max-width:88vw; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  .table th{ text-align:left; font-size:11.5px; color:var(--text-faint); padding:8px 8px; border-bottom:1px solid var(--border-soft); }
  .table td{ padding:10px 8px; border-bottom:1px solid var(--border-soft); }
  .badge{ display:inline-block; padding:3px 9px; border-radius:7px; font-size:11px; font-weight:600; }
  .badge.owner{ background:rgba(184,184,190,0.20); background:color-mix(in srgb, var(--accent) 20%, transparent); color:var(--text); }
  .badge.member{ background:rgba(255,255,255,0.07); color:var(--text-dim); }

  .settings-section{ margin-bottom:26px; }
  .settings-section h3{ font-size:14.5px; font-weight:600; margin-bottom:12px; }

  /* ---- Color picker (sidenard) ---- */
  .swatch-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .swatch{ width:34px; height:34px; border-radius:10px; cursor:pointer; border:2px solid transparent; flex-shrink:0; }
  .swatch.sel{ border-color:#fff; }
  .picker-row{ display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
  .picker-strip-wrap{
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .picker-strip{
    width:34px; height:180px; border-radius:17px; position:relative; cursor:pointer;
    touch-action:none;
    background:linear-gradient(180deg,
      #ff3b30, #ff9500, #ffcc00, #34c759, #30b0c7, #007aff, #5856d6, #af52de, #ff2d55, #ff3b30);
    border:1px solid var(--border);
  }
  .picker-handle{
    position:absolute; left:50%; width:22px; height:22px; border-radius:50%;
    background:#fff; border:3px solid #0A0A0B; transform:translate(-50%,-50%);
    box-shadow:0 2px 8px rgba(0,0,0,0.4); pointer-events:none;
  }
  .picker-label{ font-size:11.5px; color:var(--text-faint); }
  .gradient-preview{
    flex:1; min-width:160px; height:90px; border-radius:14px;
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    border:1px solid var(--border);
  }

  .hidden{ display:none !important; }
  .spinner{ display:inline-block; width:13px; height:13px; border:2px solid rgba(0,0,0,0.3);
    border-top-color:currentColor; border-radius:50%; animation:spin .6s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .thinking-dots{ display:inline-flex; gap:4px; align-items:center; height:14px; }
  .thinking-dots span{ width:6px; height:6px; border-radius:50%; background:var(--text-dim); animation:thinkPulse 1.2s infinite ease-in-out; }
  .thinking-dots span:nth-child(2){ animation-delay:0.2s; }
  .thinking-dots span:nth-child(3){ animation-delay:0.4s; }
  @keyframes thinkPulse{ 0%,60%,100%{ opacity:0.3; transform:scale(0.8); } 30%{ opacity:1; transform:scale(1); } }

  /* ---- Debug console ---- */
  .debug-console{
    position:fixed; top:0; left:0; right:0; z-index:300;
    background:rgba(8,8,9,0.97); border-bottom:1px solid var(--border);
    backdrop-filter:blur(20px);
    font-family:"SF Mono", Menlo, Consolas, monospace;
  }
  .debug-console-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 14px; font-size:12px; color:var(--text-dim); cursor:pointer;
    user-select:none;
  }
  .debug-console-body{
    max-height:34vh; overflow-y:auto; padding:0 14px 10px 14px;
    font-size:11.5px; line-height:1.6;
  }
  .dbg-line{ white-space:pre-wrap; word-break:break-all; color:var(--text-dim); }
  .dbg-line.dbg-req{ color:#7fb8ff; }
  .dbg-line.dbg-status{ color:var(--text-dim); }
  .dbg-line.dbg-body{ color:var(--text-faint); }
  .dbg-line.dbg-ok{ color:var(--green); }
  .dbg-line.dbg-err{ color:var(--red); font-weight:600; }

  /* ---- Social login buttons ---- */
  .social-row{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .social-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:11px 0; border-radius:11px;
    background:rgba(255,255,255,0.05); border:1px solid var(--border-soft);
    color:var(--text); font-size:14px; font-weight:500; cursor:pointer;
    transition:background .15s;
  }
  .social-btn:hover{ background:rgba(255,255,255,0.09); }
  .social-icon{ font-weight:700; font-size:15px; }
  .divider{ display:flex; align-items:center; text-align:center; margin-bottom:18px; color:var(--text-faint); font-size:12px; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--border-soft); }
  .divider span{ padding:0 10px; }

  /* ---- CGU checkbox + modal ---- */
  .tos-row{ display:flex; align-items:flex-start; gap:8px; margin-bottom:14px; font-size:12.5px; color:var(--text-dim); }
  .tos-row input{ margin-top:2px; }
  .tos-row span{ color:var(--text); text-decoration:underline; cursor:pointer; }
  .tos-modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:400;
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .tos-modal-overlay.show{ opacity:1; pointer-events:auto; }
  .tos-modal{
    max-width:440px; width:100%; background:rgba(18,18,20,0.98); border:1px solid var(--border);
    border-radius:20px; padding:26px; backdrop-filter:blur(20px);
  }
  .tos-modal h3{ font-size:16px; font-weight:600; margin-bottom:14px; }
  .tos-body{ font-size:13px; color:var(--text-dim); line-height:1.6; margin-bottom:20px; max-height:40vh; overflow-y:auto; }

  /* ---- Loader global ---- */
  .global-loader{
    position:fixed; inset:0; background:var(--bg); z-index:500;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .global-loader.show{ opacity:1; pointer-events:auto; }
  .loader-spin{
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.12); border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }

  /* ---- Langue select ---- */
  .lang-select{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border-soft);
    border-radius:11px; padding:12px 14px; color:var(--text); font-size:14.5px; outline:none;
  }

  /* ---- Écran de bienvenue animé ---- */
  .welcome-wrap{
    height:100%; width:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:20px;
    animation:fadeIn .4s ease;
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .welcome-title{ font-size:20px; font-weight:600; letter-spacing:-0.01em; margin-top:10px; max-width:340px; }
  .welcome-sub{ color:var(--text-dim); font-size:13.5px; margin-top:6px; }

  .cloud-anim-container{
    width:220px; height:220px; padding:15px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .cloud-anim-container .cloud{
    width:220px; display:inline; position:absolute; z-index:11;
    animation:clouds 8s infinite; animation-timing-function:ease-in-out;
  }
  .cloud-anim-container .front{ padding-top:40px; margin-left:20px; animation-duration:8s; }
  .cloud-anim-container .back{ margin-top:-26px; margin-left:130px; z-index:12; animation-duration:12s; }
  .right-front{ width:40px; height:40px; border-radius:50% 50% 50% 0%; background-color:var(--accent); display:inline-block; margin-left:-22px; z-index:5; }

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const API_BASE = "https://host.spyuhq.workers.dev";
const APP_NAME = "SpyHub Gen Tools";
const APP_INITIAL = "S";

/* =========================================================
   THEME (couleurs custom, sauvegardées en localStorage)
   ========================================================= */
const DEFAULT_THEME = { accent: "#B8B8BE", accent2: "#7A7A80" };
function loadTheme(){
  try{ return JSON.parse(localStorage.getItem('shgt_theme')) || DEFAULT_THEME; }
  catch(e){ return DEFAULT_THEME; }
}
function applyTheme(theme){
  document.documentElement.style.setProperty('--accent', theme.accent);
  document.documentElement.style.setProperty('--accent-2', theme.accent2);
  // texte du bouton lisible selon la luminosité de l'accent
  const hex = theme.accent.replace('#','');
  const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  document.documentElement.style.setProperty('--accent-text', lum > 0.6 ? '#0A0A0B' : '#F2F2F3');
}
let currentTheme = loadTheme();
applyTheme(currentTheme);

/* =========================================================
   ÉTAT
   ========================================================= */
const state = {
  user: null,
  section: 'overview',
  savedWebhook: localStorage.getItem('shgt_webhook') || '',
  sidebarOpen: false
};

const LUA_KEYWORDS = ["local","function","end","if","then","else","elseif","for","while","do","return","true","false","nil","and","or","not","repeat","until","break","print"];

function toast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* =========================================================
   LOGS SYSTÈME (gardés en mémoire pour la console Owner, plus affichés sur le login)
   ========================================================= */
const debugLog = [];
function dlog(kind, msg){
  const time = new Date().toLocaleTimeString('fr-FR', { hour12:false });
  debugLog.push({ kind, msg, time });
  if(debugLog.length > 300) debugLog.shift();
}

/* =========================================================
   API
   ========================================================= */
let _apiInFlight = 0;

async function apiRaw(path, opts){
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if(state.user && state.user.token) headers['Authorization'] = 'Bearer ' + state.user.token;
  const fullUrl = API_BASE + path;
  dlog('req', `→ ${opts.method || 'GET'} ${fullUrl}` + (opts.body ? ` body=${JSON.stringify(opts.body).slice(0,200)}` : ''));
  const res = await fetch(fullUrl, {
    method: opts.method || 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  dlog('status', `← statut HTTP ${res.status} ${res.statusText}`);
  let rawText = '';
  try{ rawText = await res.clone().text(); } catch(e){}
  let data = null;
  try{ data = JSON.parse(rawText); } catch(e){}
  return { res, data, rawText };
}

async function api(path, opts){
  opts = opts || {};

  // Anti double-clic / anti-rafale : si beaucoup de requêtes sont déjà en vol,
  // on retarde légèrement plutôt que d'en ajouter une de plus tout de suite.
  if(_apiInFlight >= 2){
    await new Promise(r => setTimeout(r, 400));
  }
  _apiInFlight++;

  const maxRetries = 3;
  let lastErr = null;

  try{
    for(let attempt = 0; attempt <= maxRetries; attempt++){
      try{
        const { res, data, rawText } = await apiRaw(path, opts);

        if(res.status === 429 && data && data.captcha){
          dlog('err', `✗ CAPTCHA requis (trop de requêtes)`);
          const solved = await showCaptchaModal();
          if(!solved){
            throw new Error("Backend not available at the moment, please try again.");
          }
          continue; // on retente la requête après résolution du captcha
        }

        if(res.status === 429){
          dlog('err', `✗ 429 Too Many Requests (tentative ${attempt+1}/${maxRetries+1})`);
          if(attempt < maxRetries){
            await new Promise(r => setTimeout(r, 500 * Math.pow(2, attempt))); // backoff : 0.5s, 1s, 2s
            continue;
          }
          throw new Error("Backend not available at the moment, please try again.");
        }

        if(res.status === 503 && data && data.maintenance){
          renderMaintenanceScreen(data.error);
          throw new Error("MAINTENANCE_MODE");
        }

        if(!res.ok){
          const rawMsg = (data && data.error) || rawText || ("HTTP " + res.status);
          dlog('err', `✗ ${rawMsg}`);
          throw new Error("Backend not available at the moment, please try again.");
        }

        dlog('ok', `✓ Requête réussie`);
        return data;

      } catch(e){
        lastErr = e;
        if(e.message === "MAINTENANCE_MODE") throw e;
        if(e.message && e.message.includes("Backend not available")) throw e;
        // Erreur réseau (fetch a échoué) : on retente aussi, sauf à la dernière tentative
        dlog('err', `✗ Échec réseau : ${e.message}`);
        if(attempt < maxRetries){
          await new Promise(r => setTimeout(r, 500 * Math.pow(2, attempt)));
          continue;
        }
        throw new Error("Backend not available at the moment, please try again.");
      }
    }
    throw lastErr || new Error("Backend not available at the moment, please try again.");
  } finally{
    _apiInFlight--;
  }
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* =========================================================
   CAPTCHA (anti-spam) — petit calcul simple affiché en modal
   ========================================================= */
function showCaptchaModal(){
  return new Promise((resolve)=>{
    const a = Math.floor(Math.random() * 8) + 1;
    const b = Math.floor(Math.random() * 8) + 1;
    const expected = a + b;

    const overlay = document.createElement('div');
    overlay.className = 'tos-modal-overlay show';
    overlay.innerHTML = `
      <div class="tos-modal" style="text-align:center;">
        <h3>Vérification anti-spam</h3>
        <div class="tos-body" style="font-size:15px;">Trop de requêtes détectées. Résous ce calcul pour continuer :</div>
        <div style="font-size:22px; font-weight:600; margin-bottom:16px;">${a} + ${b} = ?</div>
        <input id="captcha-input" type="number" class="field" style="width:100%; text-align:center; margin-bottom:14px; background:rgba(255,255,255,0.05); border:1px solid var(--border-soft); border-radius:11px; padding:12px; color:var(--text); font-size:16px;">
        <button class="btn-primary" id="captcha-submit">Valider</button>
      </div>
    `;
    document.body.appendChild(overlay);

    const submit = async ()=>{
      const val = document.getElementById('captcha-input').value;
      try{
        const { res } = await apiRaw('/anti-spam/captcha-check', {
          method:'POST', body:{ answer: val, expected }
        });
        if(res.ok){
          overlay.remove();
          resolve(true);
        } else {
          toast('Réponse incorrecte, réessaie.');
        }
      } catch(e){
        toast('Erreur de vérification.');
      }
    };
    document.getElementById('captcha-submit').onclick = submit;
    document.getElementById('captcha-input').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') submit();
    });
  });
}

/* =========================================================

}
const TOS_TEXT = `En créant un compte, vous acceptez que vos informations (pseudo, mot de passe sous forme chiffrée, préférences) soient stockées de façon sécurisée dans notre base de données. Nous ne partageons aucune donnée avec des tiers. Vous pouvez demander la suppression de votre compte et de vos données à tout moment depuis les Paramètres.`;

function renderLogin(mode){

  app.innerHTML = `

        <div class="social-row">

          </button>
          <button class="social-btn" id="apple-btn">

          </button>
        </div>
        <div class="divider"><span>ou</span></div>

        <div class="field">
          <label>Pseudo</label>
          <input id="in-user" type="text" placeholder="ex : spyuhq" autocomplete="username">
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input id="in-pass" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        ${mode === 'register' ? `
        <div class="tos-row">
          <input type="checkbox" id="tos-check">

        </div>` : ''}

        <button class="btn-primary" id="submit-btn">${mode==='login' ? 'Se connecter' : "S'inscrire"}</button>
        <div class="login-error" id="login-err"></div>
        <div class="login-toggle">
          ${mode==='login' ? `Pas de compte ? <span id="toggle-mode">Créer un compte</span>` : `Déjà un compte ? <span id="toggle-mode">Se connecter</span>`}
        </div>
      </div>
    </div>

    <div class="tos-modal-overlay" id="tos-modal-overlay">
      <div class="tos-modal">
        <h3>Conditions d'utilisation et confidentialité</h3>
        <div class="tos-body">${TOS_TEXT}</div>
        <button class="btn-primary" id="tos-close">J'ai compris</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  `;

  document.getElementById('toggle-mode').onclick = ()=> renderLogin(mode==='login' ? 'register' : 'login');
  document.getElementById('google-btn').onclick = ()=> toast('Connexion Google — bientôt disponible');
  document.getElementById('apple-btn').onclick = ()=> toast('Connexion Apple — bientôt disponible');

  if(mode === 'register'){

    document.getElementById('tos-close').onclick = ()=> document.getElementById('tos-modal-overlay').classList.remove('show');
  }

  document.getElementById('submit-btn').onclick = async ()=>{

    const p = document.getElementById('in-pass').value;

    if(mode === 'register' && !document.getElementById('tos-check').checked){

    }

    btn.disabled = true;

    showLoader();
    try{

      btn.textContent = mode==='login' ? 'Se connecter' : "S'inscrire";

    else if(id === 'shopBrowse') renderShopBrowse(c);

/* ---------- Notes ---------- */
function loadNotes(){
  try{ return JSON.parse(localStorage.getItem('shgt_notes')) || []; }
  catch(e){ return []; }
}
function saveNotes(notes){
  localStorage.setItem('shgt_notes', JSON.stringify(notes));
}

function renderNotes(c){
  let notes = loadNotes();
  c.innerHTML = `
    <div class="content-header">
      <h2>Notes</h2>
      <p>Note rapidement une idée, un bout de code ou un rappel.</p>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <div class="field" style="margin-bottom:10px;">
        <input id="note-title" type="text" placeholder="Titre de la note">
      </div>
      <div class="field" style="margin-bottom:14px;">
        <textarea id="note-content" placeholder="Contenu..." style="min-height:100px;"></textarea>
      </div>
      <button class="pill-btn run" id="add-note-btn">Ajouter la note</button>
    </div>
    <div id="notes-list"></div>
  `;

  function renderList(){
    const list = document.getElementById('notes-list');
    if(!notes.length){
      list.innerHTML = `<div class="empty-state"><div class="big">Aucune note</div>Ajoute ta première idée ci-dessus.</div>`;
      return;
    }
    list.innerHTML = notes.slice().reverse().map((n, revIdx) => {
      const i = notes.length - 1 - revIdx;
      return `
        <div class="panel" style="margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;">
            <div style="font-weight:600; font-size:14px;">${escapeHtml(n.title || 'Sans titre')}</div>

          <div style="font-size:13px; color:var(--text-dim); white-space:pre-wrap;">${escapeHtml(n.content)}</div>
        </div>
      `;
    }).join('');
    list.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = ()=>{
        notes.splice(btn.dataset.del, 1);
        saveNotes(notes);
        renderList();
      };
    });
  }
  renderList();

  document.getElementById('add-note-btn').onclick = ()=>{
    const title = document.getElementById('note-title').value.trim();
    const content = document.getElementById('note-content').value.trim();
    if(!content){ toast('La note est vide'); return; }

    renderList();
    toast('Note ajoutée');
  };
}

/* ---------- Chat GPT : conversation avec l'IA (via Groq, proxy Worker) ---------- */
let chatHistory = [];
let chatAttachments = [];

function renderMarkdownLite(text){
  let html = escapeHtml(text);
  html = html.replace(/```([\s\S]*?)```/g, (m, code) => `<pre style="background:rgba(0,0,0,0.35); border:1px solid var(--border-soft); border-radius:8px; padding:10px 12px; overflow-x:auto; margin:8px 0; font-family:'SF Mono',Menlo,monospace; font-size:12.5px;">${code.trim()}</pre>`);
  html = html.replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.08); padding:1px 6px; border-radius:5px; font-family:\'SF Mono\',Menlo,monospace; font-size:0.9em;">$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function renderChatGPT(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Chat GPT</h2>
      <p>Discute avec l'assistant IA. Tu peux joindre des fichiers texte (le contenu sera lu par l'IA).</p>
    </div>
    <div class="editor-wrap" style="height:calc(100vh - 210px);">
      <div class="console-pane" style="flex:1;">
        <div class="pane-bar">
          <span>Conversation</span>
          <button class="pill-btn" id="chat-clear-btn">Effacer</button>
        </div>
        <div class="console-body" id="chat-messages" style="display:flex; flex-direction:column; gap:14px;">
          <div class="sys">// Écris un message pour commencer la conversation.</div>
        </div>
        <div style="border-top:1px solid var(--border-soft); padding:12px; display:flex; flex-direction:column; gap:8px;">
          <div id="chat-attachments-preview" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
          <div style="display:flex; gap:8px; align-items:flex-end;">
            <input id="chat-file-input" type="file" accept=".txt,.js,.py,.lua,.json,.md,.html,.css,image/*" multiple class="hidden">
            <button class="pill-btn" id="chat-attach-btn" title="Joindre un fichier">Joindre</button>
            <textarea id="chat-input" placeholder="Écris ton message..." style="flex:1; min-height:44px; max-height:120px; background:rgba(255,255,255,0.04); border:1px solid var(--border-soft); border-radius:11px; padding:10px 14px; color:var(--text); font-size:14px; outline:none; resize:none; font-family:inherit;"></textarea>
            <button class="pill-btn run" id="chat-send-btn">Envoyer</button>
          </div>
        </div>
      </div>
    </div>
  `;

  const messagesBox = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const fileInput = document.getElementById('chat-file-input');
  const attachPreview = document.getElementById('chat-attachments-preview');

  function renderMessages(){
    if(!chatHistory.length){
      messagesBox.innerHTML = `<div class="sys">// Écris un message pour commencer la conversation.</div>`;
      return;
    }
    messagesBox.innerHTML = chatHistory.map(m => `
      <div style="align-self:${m.role === 'user' ? 'flex-end' : 'flex-start'}; max-width:85%;">
        <div style="font-size:11px; color:var(--text-faint); margin-bottom:3px;">${m.role === 'user' ? 'Toi' : 'Assistant'}</div>
        <div style="background:${m.role === 'user' ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)'}; border:1px solid var(--border-soft); border-radius:12px; padding:10px 14px; font-size:13.5px; color:var(--text); line-height:1.55;">
          ${m.thinking ? `<span class="thinking-dots"><span></span><span></span><span></span></span>` : renderMarkdownLite(m.displayContent || m.content)}
        </div>
      </div>
    `).join('');
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }
  renderMessages();

  function renderAttachPreview(){
    attachPreview.innerHTML = chatAttachments.map((a, i) => `
      <div class="pill-btn" style="cursor:default;">${escapeHtml(a.name)} <span data-remove-att="${i}" style="cursor:pointer; margin-left:6px; color:var(--red);">×</span></div>
    `).join('');
    attachPreview.querySelectorAll('[data-remove-att]').forEach(el=>{
      el.onclick = ()=>{ chatAttachments.splice(el.dataset.removeAtt, 1); renderAttachPreview(); };
    });
  }

  document.getElementById('chat-attach-btn').onclick = ()=> fileInput.click();
  fileInput.onchange = async ()=>{
    for(const file of fileInput.files){
      if(file.type.startsWith('image/')){
        toast(`"${file.name}" est une image — ce modèle ne peut pas encore l'analyser, seul son nom sera mentionné.`);
        chatAttachments.push({ name: file.name, content: `[Image jointe : ${file.name} — non analysable par ce modèle]`, isImage: true });
      } else {
        const text = await file.text();
        chatAttachments.push({ name: file.name, content: text });
      }
    }
    fileInput.value = '';
    renderAttachPreview();
  };

  document.getElementById('chat-clear-btn').onclick = ()=>{
    chatHistory = [];
    chatAttachments = [];
    renderMessages();
    renderAttachPreview();
  };

  async function sendMessage(){
    const text = input.value.trim();
    if(!text && !chatAttachments.length){ toast('Écris un message ou joins un fichier'); return; }

    let fullContent = text;
    let displayContent = text;
    if(chatAttachments.length){
      const attachedText = chatAttachments.map(a => `\n\n--- Fichier joint : ${a.name} ---\n${a.content}`).join('');
      fullContent = (text || "Voici les fichiers joints :") + attachedText;
      displayContent = (text ? text + '\n' : '') + chatAttachments.map(a => `[Fichier : ${a.name}]`).join(' ');
    }

    chatHistory.push({ role:'user', content: fullContent, displayContent });
    input.value = '';
    chatAttachments = [];
    renderAttachPreview();
    renderMessages();

    const sendBtn = document.getElementById('chat-send-btn');
    sendBtn.disabled = true;
    sendBtn.innerHTML = '<span class="spinner"></span>';

    chatHistory.push({ role:'assistant', content:'', displayContent:'', thinking:true });
    renderMessages();

    try{
      const apiMessages = chatHistory
        .slice(0, -1)
        .map(m => ({ role: m.role, content: m.content }));

      const data = await api('/ai/chat', { method:'POST', body:{ messages: apiMessages } });
      chatHistory[chatHistory.length - 1] = { role:'assistant', content: data.reply, displayContent: data.reply };
    } catch(e){
      chatHistory[chatHistory.length - 1] = { role:'assistant', content: e.message, displayContent: e.message };
    } finally{
      renderMessages();
      sendBtn.disabled = false;
      sendBtn.textContent = 'Envoyer';
    }
  }

  document.getElementById('chat-send-btn').onclick = sendMessage;
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });
}

          <button class="pill-btn run" id="live-chat-send-btn">Envoyer</button>
        </div>
      </div>
    </div>
  `;

  const box = document.getElementById('live-chat-messages');
  const input = document.getElementById('live-chat-input');

  function renderList(messages){
    if(!messages.length){
      box.innerHTML = `<div class="sys">// Aucun message. Sois le premier à écrire.</div>`;
      return;
    }
    const wasNearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 80;
    box.innerHTML = messages.map(m => `
      <div style="align-self:${m.author === state.user.username ? 'flex-end' : 'flex-start'}; max-width:80%;">
        <div style="font-size:11px; color:var(--text-faint); margin-bottom:3px;">${escapeHtml(m.author)} · ${new Date(m.createdAt).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}</div>
        <div style="background:${m.author === state.user.username ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)'}; border:1px solid var(--border-soft); border-radius:12px; padding:9px 13px; font-size:13.5px; color:var(--text); white-space:pre-wrap; position:relative;">
          ${escapeHtml(m.content)}
          ${(m.author === state.user.username || state.user.role === 'owner') ? `<span data-del-msg="${m.id}" style="cursor:pointer; color:var(--red); font-size:11px; margin-left:8px;">supprimer</span>` : ''}
        </div>
      </div>
    `).join('');
    if(wasNearBottom) box.scrollTop = box.scrollHeight;
    box.querySelectorAll('[data-del-msg]').forEach(el=>{
      el.onclick = async ()=>{
        try{ await api('/chat/messages/' + el.dataset.delMsg, { method:'DELETE' }); loadMessages(); }
        catch(e){ toast(e.message); }
      };
    });
  }

  async function loadMessages(){
    try{
      const data = await api('/chat/messages');
      renderList(data.messages || []);
    } catch(e){
      box.innerHTML = `<div class="err">${escapeHtml(e.message)}</div>`;
    }
  }
  loadMessages();

  if(chatPollTimer) clearInterval(chatPollTimer);
  chatPollTimer = setInterval(loadMessages, 5000);

  async function send(){
    const text = input.value.trim();
    if(!text) return;
    const btn = document.getElementById('live-chat-send-btn');
    btn.disabled = true;
    try{
      await api('/chat/messages', { method:'POST', body:{ content: text } });
      input.value = '';
      loadMessages();
    } catch(e){ toast(e.message); }
    finally{ btn.disabled = false; }
  }
  document.getElementById('live-chat-send-btn').onclick = send;
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
}

function renderCodeEditor(c, kind){
  c.innerHTML = `
    <div class="content-header">
      <h2>Lua</h2>
      <p>Écris ton script Lua et exécute-le pour de vrai.</p>
    </div>
    <div class="editor-wrap">
      <div class="editor-pane">
        <div class="pane-bar">
          <span>Script</span>
          <div class="tools">
            <button class="pill-btn" id="dl-btn">Télécharger</button>
            <button class="pill-btn run" id="run-btn">Exécuter</button>
          </div>
        </div>
        <textarea class="code-input" id="code-input" spellcheck="false" placeholder="-- écris ton script Lua ici"></textarea>
      </div>
      <div class="console-pane">
        <div class="pane-bar">
          <span>Console</span>
          <div class="tools">
            <button class="pill-btn" id="copy-console">Copier</button>
            <button class="pill-btn" id="clear-console">Vider</button>
          </div>
        </div>
        <div class="console-body" id="console-body"><div class="sys">// La console s'affichera ici après exécution.</div></div>
      </div>
    </div>
    <div class="autocomplete-box" id="autocomplete"></div>
  `;

  const input = document.getElementById('code-input');
  const autoBox = document.getElementById('autocomplete');

  input.addEventListener('keyup', ()=>{
    const val = input.value;
    const pos = input.selectionStart;
    const before = val.slice(0, pos);
    const match = before.match(/[a-zA-Z_]+$/);
    if(match && match[0].length >= 2){
      const word = match[0];
      const sugg = LUA_KEYWORDS.filter(k => k.startsWith(word) && k !== word);
      if(sugg.length){
        autoBox.style.display = 'block';
        autoBox.style.left = '20px';
        autoBox.style.top = '44px';
        autoBox.innerHTML = sugg.slice(0,6).map(s => `<div class="autocomplete-item" data-word="${s}">${s}</div>`).join('');
        autoBox.querySelectorAll('.autocomplete-item').forEach(item=>{
          item.onclick = ()=>{
            const w = item.dataset.word;
            input.value = before.slice(0, before.length - word.length) + w + val.slice(pos);
            autoBox.style.display = 'none';
            input.focus();
          };
        });
        return;
      }
    }
    autoBox.style.display = 'none';
  });
  input.addEventListener('blur', ()=> setTimeout(()=> autoBox.style.display='none', 150));

  document.getElementById('run-btn').onclick = async ()=>{
    const body = document.getElementById('console-body');
    const code = input.value;
    const runBtn = document.getElementById('run-btn');
    if(!code.trim()){
      body.innerHTML = `<div class="err">Erreur : aucun code à exécuter.</div>`;
      return;
    }
    runBtn.disabled = true;
    runBtn.innerHTML = '<span class="spinner"></span>';
    body.innerHTML = `<div class="sys">// Exécution en cours…</div>`;

    try{
      const res = await fetch('https://emkc.org/api/v2/piston/execute', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ language: 'lua', version: '*', files: [{ content: code }] })
      });
      const data = await res.json();
      const out = (data.run && data.run.stdout) || '';
      const errOut = (data.run && data.run.stderr) || '';
      const compileErr = (data.compile && data.compile.stderr) || '';
      let html = '';
      if(out) html += `<div class="ok">${escapeHtml(out)}</div>`;
      if(compileErr) html += `<div class="err">${escapeHtml(compileErr)}</div>`;
      if(errOut) html += `<div class="err">${escapeHtml(errOut)}</div>`;
      if(!out && !errOut && !compileErr) html = `<div class="sys">// Aucune sortie.</div>`;
      body.innerHTML = html;
    } catch(e){
      body.innerHTML = `<div class="err">Erreur d'exécution : impossible de contacter l'API d'exécution. ${escapeHtml(e.message)}</div>`;
    } finally{
      runBtn.disabled = false;
      runBtn.textContent = 'Exécuter';
    }
  };

  document.getElementById('dl-btn').onclick = ()=>{
    const blob = new Blob([input.value], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `script.lua`;
    a.click();
  };

  document.getElementById('copy-console').onclick = ()=>{
    navigator.clipboard.writeText(document.getElementById('console-body').innerText);
    toast('Console copiée');
  };
  document.getElementById('clear-console').onclick = ()=>{
    document.getElementById('console-body').innerHTML = `<div class="sys">// Console vidée.</div>`;
  };
}

const JS_KEYWORDS = ["const","let","var","function","return","if","else","for","while","class","import","export","async","await","true","false","null","undefined","console.log","document","window"];
const CSS_KEYWORDS = ["display","flex","grid","color","background","margin","padding","border","width","height","position","absolute","relative","font-size","font-weight","border-radius","transition","transform"];
const HTML_KEYWORDS = ["div","span","button","input","textarea","section","header","footer","nav","h1","h2","h3","p","a","img","ul","li","form","class","id"];

const devFiles = {
  html: { name:'index.html', content: `<h1>Hello world</h1>\n<p>Modifie ce fichier pour commencer.</p>\n<button onclick="sayHi()">Clique-moi</button>` },
  css:  { name:'style.css', content: `body {\n  font-family: sans-serif;\n  background: #111;\n  color: #eee;\n  padding: 40px;\n}` },
  js:   { name:'script.js', content: `function sayHi(){\n  console.log("Bonjour !");\n  alert("Bonjour !");\n}` }
};
let devActiveTab = 'html';
let devMode = 'web'; // 'web' = éditeur multi-fichiers, 'run' = exécution Python/JS

function devKeywordsFor(tab){
  if(tab === 'html') return HTML_KEYWORDS;

  return JS_KEYWORDS;
}

      <div class="field" style="margin-bottom:14px;">
        <label>Code HTML</label>
        <textarea id="site-html" placeholder="<h1>Hello world</h1>" style="min-height:120px;"></textarea>
      </div>
      <button class="pill-btn run" id="publish-btn">Publier</button>
    </div>
    <div id="sites-list"><div class="empty-state">Chargement…</div></div>
  `;

  async function loadList(){
    const list = document.getElementById('sites-list');
    try{
      const data = await api('/sites/mine');
      const sites = data.sites || [];
      if(!sites.length){
        list.innerHTML = `<div class="empty-state"><div class="big">Aucun site publié</div>Crée ton premier site ci-dessus.</div>`;
        return;
      }
      list.innerHTML = sites.map(s => `
        <div class="site-row">
          <div>
            <div class="name">${escapeHtml(s.name)}</div>
            <div class="link">${API_BASE}/site/${s.id}</div>
          </div>
          <div class="actions">
            <button class="pill-btn" data-copy="${s.id}">Copier</button>
            <button class="pill-btn danger" data-del="${s.id}">Supprimer</button>
          </div>
        </div>
      `).join('');
      list.querySelectorAll('[data-copy]').forEach(btn=>{
        btn.onclick = ()=>{
          navigator.clipboard.writeText(`${API_BASE}/site/${btn.dataset.copy}`);
          toast('Lien copié');
        };
      });
      list.querySelectorAll('[data-del]').forEach(btn=>{
        btn.onclick = async ()=>{
          try{ await api('/sites/' + btn.dataset.del, { method:'DELETE' }); toast('Site supprimé'); loadList(); }
          catch(e){ toast(e.message); }
        };
      });
    } catch(e){
      list.innerHTML = `<div class="empty-state"><div class="big" style="color:var(--red)">Impossible de charger tes sites</div>${escapeHtml(e.message)}</div>`;
    }
  }
  loadList();

  document.getElementById('publish-btn').onclick = async ()=>{
    const name = document.getElementById('site-name').value.trim();
    const html = document.getElementById('site-html').value;
    const btn = document.getElementById('publish-btn');
    if(!name){ toast('Donne un nom au site'); return; }
    if(!html.trim()){ toast('Le code HTML est vide'); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try{
      await api('/sites', { method:'POST', body:{ name, html } });
      document.getElementById('site-name').value = '';
      document.getElementById('site-html').value = '';
      toast('Site publié');
      loadList();
    } catch(e){ toast(e.message); }
    finally{ btn.disabled = false; btn.textContent = 'Publier'; }
  };
}

/* ---------- Discord ---------- */
function renderDiscord(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Annonce Discord</h2>
      <p>Envoie un embed via un webhook Discord. Le webhook est sauvegardé pour la prochaine fois.</p>
    </div>
    <div class="panel" style="max-width:560px;">
      <div class="field">
        <label>Webhook Discord</label>
        <input id="wh-url" type="text" placeholder="https://discord.com/api/webhooks/..." value="${escapeHtml(state.savedWebhook)}">
      </div>
      <div class="field">
        <label>Titre de l'embed</label>
        <input id="embed-title" type="text" placeholder="Titre de l'annonce">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="embed-desc" placeholder="Contenu de l'annonce..."></textarea>
      </div>
      <button class="pill-btn run" id="send-btn">Envoyer l'annonce</button>
      <div class="embed-preview" id="preview" style="display:none;">
        <div class="etitle" id="pv-title"></div>
        <div class="edesc" id="pv-desc"></div>
      </div>
    </div>
  `;

  const titleI = document.getElementById('embed-title');
  const descI = document.getElementById('embed-desc');
  function updatePreview(){
    const t = titleI.value, d = descI.value;
    if(!t && !d){ document.getElementById('preview').style.display='none'; return; }
    document.getElementById('preview').style.display='block';
    document.getElementById('pv-title').textContent = t;
    document.getElementById('pv-desc').textContent = d;
  }
  titleI.oninput = updatePreview;
  descI.oninput = updatePreview;

  document.getElementById('send-btn').onclick = async ()=>{
    const url = document.getElementById('wh-url').value.trim();
    const title = titleI.value.trim();
    const desc = descI.value.trim();
    const btn = document.getElementById('send-btn');
    if(!url){ toast('Colle un lien de webhook'); return; }
    if(!title && !desc){ toast("Ajoute un titre ou une description"); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try{
      const res = await fetch(url, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ embeds:[{ title, description:desc, color: 12105912 }] })
      });
      if(!res.ok) throw new Error('Discord a refusé la requête (lien invalide ?)');
      localStorage.setItem('shgt_webhook', url);
      state.savedWebhook = url;
      toast('Annonce envoyée');
    } catch(e){ toast(e.message); }
    finally{ btn.disabled = false; btn.textContent = "Envoyer l'annonce"; }
  };
}

/* ---------- Paramètres (avec sélecteur de couleur custom) ---------- */
const PRESET_THEMES = [
  { accent:"#B8B8BE", accent2:"#7A7A80" }, // gris neutre (défaut)
  { accent:"#5E9EFF", accent2:"#2f5fb8" }, // bleu
  { accent:"#5FD98A", accent2:"#2f9e5c" }, // vert
  { accent:"#FF6B6B", accent2:"#b83c3c" }, // rouge
  { accent:"#C77DFF", accent2:"#7b2fbf" }, // violet
  { accent:"#FFB84D", accent2:"#c67c1e" }, // orange
];

function hslToHex(h, s, l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}

function renderSettings(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Paramètres</h2>
      <p>Gère ton compte et personnalise l'interface.</p>
    </div>

    <div class="settings-section">
      <h3>Couleur d'accent</h3>
      <div class="panel">
        <div class="swatch-row" id="swatch-row"></div>
        <div class="picker-row">
          <div class="picker-strip-wrap">
            <div class="picker-strip" id="picker-strip"><div class="picker-handle" id="picker-handle"></div></div>
            <div class="picker-label">Glisse pour choisir</div>
          </div>
          <div class="gradient-preview" id="gradient-preview"></div>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <h3>Changer le mot de passe</h3>
      <div class="panel" style="max-width:420px;">
        <div class="field">
          <label>Mot de passe actuel</label>
          <input id="cur-pass" type="password">
        </div>
        <div class="field">
          <label>Nouveau mot de passe</label>
          <input id="new-pass" type="password">
        </div>
        <button class="pill-btn run" id="change-pass-btn">Mettre à jour</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>Webhook Discord enregistré</h3>
      <div class="panel" style="max-width:420px;">
        <div class="field" style="margin-bottom:12px;">
          <input id="wh-set" type="text" value="${escapeHtml(state.savedWebhook)}" placeholder="Aucun webhook enregistré" readonly>
        </div>
        <button class="pill-btn danger" id="clear-wh-btn">Oublier ce webhook</button>
      </div>
    </div>
  `;

  // Swatches (presets rapides)
  const swatchRow = document.getElementById('swatch-row');
  swatchRow.innerHTML = PRESET_THEMES.map((t,i) => `
    <div class="swatch ${t.accent===currentTheme.accent ? 'sel':''}" data-i="${i}"
         style="background:linear-gradient(120deg, ${t.accent}, ${t.accent2});"></div>
  `).join('');
  swatchRow.querySelectorAll('.swatch').forEach(el=>{
    el.onclick = ()=>{
      const t = PRESET_THEMES[el.dataset.i];
      setTheme(t.accent, t.accent2);
      swatchRow.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
    };
  });

  // Picker strip (glisser pour choisir une teinte, façon sidenard iOS)
  const strip = document.getElementById('picker-strip');
  const handle = document.getElementById('picker-handle');

  function setHandleFromEvent(clientY){
    const rect = strip.getBoundingClientRect();
    let pct = (clientY - rect.top) / rect.height;
    pct = Math.max(0, Math.min(1, pct));
    handle.style.top = (pct * 100) + '%';
    const hue = pct * 360;
    const accent = hslToHex(hue, 70, 65);
    const accent2 = hslToHex(hue, 65, 40);
    setTheme(accent, accent2, false);
  }

  let dragging = false;
  strip.addEventListener('pointerdown', (e)=>{ dragging = true; setHandleFromEvent(e.clientY); strip.setPointerCapture(e.pointerId); });
  strip.addEventListener('pointermove', (e)=>{ if(dragging) setHandleFromEvent(e.clientY); });
  strip.addEventListener('pointerup', ()=>{ dragging = false; });
  strip.addEventListener('pointercancel', ()=>{ dragging = false; });

  function setTheme(accent, accent2, clearSwatchSel){
    currentTheme = { accent, accent2 };
    applyTheme(currentTheme);
    localStorage.setItem('shgt_theme', JSON.stringify(currentTheme));
    document.getElementById('gradient-preview').style.background = `linear-gradient(120deg, ${accent}, ${accent2})`;
    if(clearSwatchSel !== false){
      // rien de plus, presets gérés séparément
    }
  }

  document.getElementById('change-pass-btn').onclick = async ()=>{
    const cur = document.getElementById('cur-pass').value;
    const neu = document.getElementById('new-pass').value;
    if(!cur || !neu){ toast('Remplis les deux champs'); return; }
    try{
      await api('/auth/change-password', { method:'POST', body:{ current:cur, next:neu } });
      toast('Mot de passe mis à jour');
      document.getElementById('cur-pass').value = '';
      document.getElementById('new-pass').value = '';
    } catch(e){ toast(e.message); }
  };

  document.getElementById('clear-wh-btn').onclick = ()=>{
    localStorage.removeItem('shgt_webhook');
    state.savedWebhook = '';
    document.getElementById('wh-set').value = '';
    toast('Webhook oublié');
  };
}

/* ---------- Dashboard Owner ---------- */
async function renderAdmin(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Dashboard Owner</h2>
      <p>Vue globale sur les comptes, les sites hébergés et la modération de la plateforme.</p>

      <div class="stat-card"><div class="label">Sites publiés</div><div class="value">…</div></div>
    </div>

    <div class="settings-section">

      <div class="panel" style="max-width:480px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">

          <button class="pill-btn danger" id="maintenance-off-btn">Désactiver</button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <h3>Bannir une IP</h3>
      <div class="panel" style="max-width:480px;">
        <div class="field" style="margin-bottom:10px;">
          <label>Adresse IP</label>
          <input id="ban-ip-input" type="text" placeholder="ex : 203.0.113.42">
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label>Durée</label>
          <select id="ban-ip-duration" class="lang-select">
            <option value="3">Temporaire — 3 heures</option>
            <option value="24">Temporaire — 24 heures</option>
            <option value="permanent">Permanent</option>
          </select>
        </div>
        <button class="pill-btn danger" id="ban-ip-btn">Bannir cette IP</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>IPs actuellement bannies</h3>
      <div class="panel" id="banned-ips-list"><div class="empty-state">Chargement…</div></div>
    </div>

    <div class="settings-section">
      <h3>Comptes</h3>
      <div class="panel">
        <div style="overflow-x:auto;">
          <table class="table" id="accounts-table">
            <thead><tr><th>Pseudo</th><th>Rôle</th><th>Sites</th><th></th></tr></thead>
            <tbody><tr><td colspan="4">Chargement…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  // ---- Vue d'ensemble + comptes ----
  try{
    const data = await api('/admin/overview');
    document.querySelector('#admin-cards .stat-card .value.accent').textContent = data.accounts.length;
    document.querySelectorAll('#admin-cards .stat-card .value')[1].textContent = data.totalSites;

    const tbody = document.querySelector('#accounts-table tbody');
    tbody.innerHTML = data.accounts.map(a => `
      <tr>
        <td>${escapeHtml(a.username)}</td>
        <td><span class="badge ${a.role}">${a.role === 'owner' ? 'Owner' : 'Membre'}</span></td>
        <td>${a.siteCount}</td>
        <td>${a.role !== 'owner' ? `
          <button class="pill-btn danger" data-ban-user="${a.username}">Bannir</button>
          <button class="pill-btn danger" data-del="${a.username}">Supprimer</button>
        ` : ''}</td>
      </tr>
    `).join('');

    tbody.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm(`Supprimer le compte ${btn.dataset.del} ?`)) return;
        try{ await api('/admin/accounts/' + btn.dataset.del, { method:'DELETE' }); toast('Compte supprimé'); renderAdmin(c); }
        catch(e){ toast(e.message); }
      };
    });
    tbody.querySelectorAll('[data-ban-user]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm(`Bannir le compte ${btn.dataset.banUser} ?`)) return;

    document.querySelector('#accounts-table tbody').innerHTML = `<tr><td colspan="4" style="color:var(--red)">${escapeHtml(e.message)}</td></tr>`;

    const m = await api('/settings/maintenance');

      : `<span style="color:var(--green)">Désactivé</span>`;

    document.getElementById('maintenance-status').textContent = '—';

      await api('/settings/maintenance', { method:'POST', body:{ enabled:true, message } });

        };
      });
    } catch(e){
      box.innerHTML = `<div class="empty-state" style="color:var(--red)">Impossible de charger.</div>`;
    }
  }
  loadBannedIps();
}
