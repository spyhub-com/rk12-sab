<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpyHub Agent</title>
<style>
  :root{
    --bordeaux:#5c1a2e; --rose:#8c3a52; --cuivre:#b87333;
    --bg:#0b0a0c; --panel:rgba(255,255,255,0.05); --border:rgba(255,255,255,0.1);
    --text:#f2ede9; --muted:#9b8f94; --danger:#e0556f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--text); background:var(--bg); overflow:hidden;
  }
  .bg{
    position:fixed; inset:0; z-index:-1;
    background:radial-gradient(circle at 30% 20%, var(--bordeaux), transparent 60%),
               radial-gradient(circle at 80% 80%, var(--cuivre), transparent 55%),
               radial-gradient(circle at 50% 100%, var(--rose), transparent 60%), var(--bg);
    background-size:200% 200%;
    animation:drift 14s ease-in-out infinite alternate;
    filter:blur(60px) saturate(1.3);
  }
  @keyframes drift{0%{background-position:0% 0%;}100%{background-position:100% 100%;}}
  .glass{
    background:var(--panel); border:1px solid var(--border); border-radius:20px;
    backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
    box-shadow:0 8px 32px rgba(0,0,0,0.35);
  }

  /* ---------- Auth screen ---------- */
  #auth{height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;}
  #auth .card{width:100%;max-width:380px;padding:32px;}
  #auth h1{font-size:1.5rem;font-weight:600;margin-bottom:4px;}
  #auth p.sub{color:var(--muted);font-size:0.9rem;margin-bottom:24px;}
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,0.06);padding:4px;border-radius:12px;margin-bottom:20px;}
  .tabs button{flex:1;padding:8px;border:none;background:transparent;color:var(--muted);border-radius:9px;font-size:0.85rem;cursor:pointer;transition:all .2s;}
  .tabs button.active{background:linear-gradient(135deg,var(--bordeaux),var(--cuivre));color:#fff;}
  label{display:block;font-size:0.8rem;color:var(--muted);margin:14px 0 6px;}
  input{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
    background:rgba(0,0,0,0.25);color:var(--text);font-size:0.95rem;outline:none;
  }
  input:focus{border-color:var(--cuivre);}
  .btn{
    width:100%;margin-top:22px;padding:13px;border:none;border-radius:12px;font-size:0.95rem;font-weight:600;
    color:#fff;background:linear-gradient(135deg,var(--bordeaux),var(--rose) 50%,var(--cuivre));
    cursor:pointer;transition:transform .15s, filter .15s;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn:active{transform:scale(0.98);}
  .error{color:var(--danger);font-size:0.82rem;margin-top:12px;min-height:1em;}

  /* ---------- Chat screen ---------- */
  #chat{height:100dvh;display:none;flex-direction:column;padding:16px;}
  header.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin-bottom:12px;}
  header.top .who{font-size:0.9rem;color:var(--muted);}
  header.top button{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:10px;cursor:pointer;font-size:0.8rem;}
  #messages{flex:1;overflow-y:auto;padding:8px 4px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:0.92rem;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--bordeaux),var(--rose));border-bottom-right-radius:4px;}
  .msg.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .msg.file{display:flex;align-items:center;gap:10px;}
  .msg.file a{color:var(--cuivre);text-decoration:none;font-weight:600;}
  .composer{display:flex;gap:10px;padding:12px;margin-top:8px;}
  .composer textarea{
    flex:1;resize:none;max-height:140px;padding:12px 14px;border-radius:14px;border:1px solid var(--border);
    background:rgba(0,0,0,0.25);color:var(--text);font-size:0.92rem;font-family:inherit;outline:none;
  }
  .composer textarea:focus{border-color:var(--cuivre);}
  .composer button{
    padding:0 20px;border:none;border-radius:14px;color:#fff;font-weight:600;
    background:linear-gradient(135deg,var(--bordeaux),var(--cuivre));cursor:pointer;
  }
</style>
</head>
<body>
<div class="bg"></div>

<!-- Écran login / création de compte -->
<section id="auth">
  <div class="card glass">
    <h1>SpyHub Agent</h1>
    <p class="sub">Assistant IA dev de la communauté</p>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Connexion</button>
      <button id="tabRegister" onclick="switchTab('register')">Créer un compte</button>
    </div>
    <form id="authForm" onsubmit="return submitAuth(event)">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email">
      <label>Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="8">
      <button class="btn" id="submitBtn" type="submit">Se connecter</button>
      <div class="error" id="authError"></div>
    </form>
  </div>
</section>

<!-- Écran chat -->
<section id="chat">
  <header class="top glass">
    <span class="who" id="whoami"></span>
    <button onclick="logout()">Déconnexion</button>
  </header>
  <div id="messages"></div>
  <div class="composer glass">
    <textarea id="input" rows="1" placeholder="Écris ton message... (Python, Lua, JS, etc.)"></textarea>
    <button onclick="sendMessage()">Envoyer</button>
  </div>
</section>

<script>
  const API_BASE = "https://ai.spyuhq.workers.dev";
  const SIZE_LIMIT = 20 * 1024; // 20 Ko -> devient un fichier .txt joint

  let mode = "login";
  const els = (id) => document.getElementById(id);

  function switchTab(next){
    mode = next;
    els("tabLogin").classList.toggle("active", next==="login");
    els("tabRegister").classList.toggle("active", next==="register");
    els("submitBtn").textContent = next==="login" ? "Se connecter" : "Créer le compte";
    els("authError").textContent = "";
  }

  async function submitAuth(e){
    e.preventDefault();
    els("authError").textContent = "";
    const email = els("email").value.trim();
    const password = els("password").value;
    const route = mode === "login" ? "/auth/login" : "/auth/register";
    try{
      const res = await fetch(API_BASE + route, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({email, password})
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || "Erreur");
      localStorage.setItem("spyhub_token", data.token);
      localStorage.setItem("spyhub_email", data.email);
      enterChat(data.email);
    }catch(err){
      els("authError").textContent = err.message;
    }
    return false;
  }

  function enterChat(email){
    els("whoami").textContent = email;
    document.getElementById("auth").style.display = "none";
    document.getElementById("chat").style.display = "flex";
  }

  function logout(){
    localStorage.removeItem("spyhub_token");
    localStorage.removeItem("spyhub_email");
    document.getElementById("chat").style.display = "none";
    document.getElementById("auth").style.display = "flex";
    document.getElementById("messages").innerHTML = "";
  }

  // Affiche un message dans le chat. Si le contenu dépasse SIZE_LIMIT,
  // il est transformé en pièce jointe .txt téléchargeable au lieu de texte brut.
  function renderMessage(role, content){
    const box = els("messages");
    const bytes = new Blob([content]).size;

    if(bytes > SIZE_LIMIT){
      const blob = new Blob([content], {type:"text/plain"});
      const url = URL.createObjectURL(blob);
      const div = document.createElement("div");
      div.className = `msg ${role} file`;
      div.innerHTML = `📎 <a href="${url}" download="message.txt">message.txt</a> <span style="color:var(--muted);font-size:0.8em">(${(bytes/1024).toFixed(1)} Ko)</span>`;
      box.appendChild(div);
    }else{
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = content;
      box.appendChild(div);
    }
    box.scrollTop = box.scrollHeight;
  }

  async function sendMessage(){
    const input = els("input");
    const text = input.value.trim();
    if(!text) return;
    input.value = "";
    renderMessage("user", text);

    const token = localStorage.getItem("spyhub_token");
    try{
      const res = await fetch(API_BASE + "/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json", "Authorization":"Bearer " + token},
        body: JSON.stringify({message: text})
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || "Erreur");
      renderMessage("assistant", data.reply);
    }catch(err){
      renderMessage("assistant", "⚠️ " + err.message);
    }
  }

  els("input")?.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  });

  // Reconnexion auto si un token est déjà en localStorage
  (function init(){
    const token = localStorage.getItem("spyhub_token");
    const email = localStorage.getItem("spyhub_email");
    if(token && email) enterChat(email);
  })();
</script>
</body>
</html>
