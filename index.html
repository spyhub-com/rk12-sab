<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge</title>
<style>
  :root{
    --bg:#0A0A0C;
    --bg-2:#111114;
    --glass:rgba(255,255,255,0.045);
    --glass-strong:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.09);
    --border-soft:rgba(255,255,255,0.06);
    --text:#F5F5F7;
    --text-dim:#93939B;
    --text-faint:#5A5A62;
    --accent:#5E9EFF;
    --accent-dim:#3D6FC4;
    --red:#FF6B6B;
    --green:#5FD98A;
    --radius:18px;
    --radius-sm:12px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    height:100%;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body{
    background-image:
      radial-gradient(circle at 15% 20%, rgba(94,158,255,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(94,158,255,0.06), transparent 50%);
  }
  #app{ height:100vh; width:100vw; }

  /* ---------- Scrollbars ---------- */
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  /* ---------- Login screen ---------- */
  .login-wrap{
    height:100%; width:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .login-card{
    width:380px;
    padding:40px 36px;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:24px;
    backdrop-filter:blur(30px) saturate(160%);
    -webkit-backdrop-filter:blur(30px) saturate(160%);
    box-shadow:0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    animation:riseIn .5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .login-mark{
    width:46px; height:46px;
    border-radius:13px;
    background:linear-gradient(155deg, var(--accent), #2f5fb8);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:600;
    margin-bottom:22px;
    box-shadow:0 8px 20px rgba(94,158,255,0.35);
  }
  .login-card h1{
    font-size:22px; font-weight:600; letter-spacing:-0.01em;
    margin-bottom:6px;
  }
  .login-card p.sub{
    color:var(--text-dim); font-size:14px; margin-bottom:28px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:12.5px; color:var(--text-dim);
    margin-bottom:7px; font-weight:500;
  }
  .field input{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border-soft);
    border-radius:11px;
    padding:12px 14px;
    color:var(--text);
    font-size:14.5px;
    outline:none;
    transition:border-color .15s, background .15s;
  }
  .field input:focus{
    border-color:rgba(94,158,255,0.55);
    background:rgba(255,255,255,0.06);
  }
  .btn-primary{
    width:100%;
    background:var(--accent);
    color:#0A0A0C;
    border:none;
    border-radius:11px;
    padding:12px 0;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    margin-top:8px;
    transition:filter .15s, transform .1s;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:active{ transform:scale(0.98); }
  .login-toggle{
    text-align:center; margin-top:18px; font-size:13.5px; color:var(--text-dim);
  }
  .login-toggle span{ color:var(--accent); cursor:pointer; }
  .login-error{
    color:var(--red); font-size:13px; margin-top:10px; display:none;
  }

  /* ---------- Main layout ---------- */
  .main-layout{ display:flex; height:100%; width:100%; }
  .sidebar{
    width:250px; flex-shrink:0;
    background:rgba(255,255,255,0.02);
    border-right:1px solid var(--border-soft);
    display:flex; flex-direction:column;
    padding:20px 14px;
    backdrop-filter:blur(20px);
  }
  .sidebar-header{
    display:flex; align-items:center; gap:10px;
    padding:6px 8px 22px 8px;
  }
  .sidebar-header .mark{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(155deg, var(--accent), #2f5fb8);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700;
  }
  .sidebar-header .name{ font-size:15.5px; font-weight:600; letter-spacing:-0.01em; }

  .nav-group{ margin-bottom:18px; }
  .nav-label{
    font-size:11px; text-transform:none; color:var(--text-faint);
    padding:0 10px; margin-bottom:6px; font-weight:600;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px;
    border-radius:9px;
    color:var(--text-dim);
    font-size:14px;
    cursor:pointer;
    transition:background .12s, color .12s;
    user-select:none;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.045); color:var(--text); }
  .nav-item.active{
    background:rgba(94,158,255,0.14);
    color:var(--text);
  }
  .nav-item .dot{
    width:6px; height:6px; border-radius:50%;
    background:currentColor; opacity:0.5;
  }
  .nav-item.active .dot{ background:var(--accent); opacity:1; }

  .sidebar-footer{
    margin-top:auto;
    border-top:1px solid var(--border-soft);
    padding-top:14px;
    display:flex; align-items:center; gap:10px;
    padding-left:8px;
  }
  .avatar{
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(155deg,#3a3a40,#1c1c1f);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600; color:var(--text-dim);
    border:1px solid var(--border);
  }
  .user-meta{ line-height:1.25; }
  .user-meta .uname{ font-size:13.5px; font-weight:600; }
  .user-meta .urole{ font-size:11.5px; color:var(--text-faint); }
  .logout-btn{
    margin-left:auto; color:var(--text-faint); cursor:pointer; font-size:12px;
  }
  .logout-btn:hover{ color:var(--red); }

  /* ---------- Content area ---------- */
  .content{ flex:1; overflow-y:auto; padding:34px 42px; }
  .content-header{ margin-bottom:26px; }
  .content-header h2{ font-size:24px; font-weight:600; letter-spacing:-0.015em; margin-bottom:5px; }
  .content-header p{ color:var(--text-dim); font-size:14px; max-width:520px; }

  .panel{
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    padding:22px;
  }

  .grid-cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:14px;
    margin-top:6px;
  }
  .stat-card{
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:18px;
  }
  .stat-card .label{ font-size:12.5px; color:var(--text-dim); margin-bottom:10px; }
  .stat-card .value{ font-size:26px; font-weight:600; letter-spacing:-0.02em; }
  .stat-card .value.accent{ color:var(--accent); }

  /* ---------- Editor layout (Lua / Dev tools) ---------- */
  .editor-wrap{ display:flex; gap:14px; height:calc(100vh - 190px); }
  .editor-pane, .console-pane{
    flex:1;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .pane-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--border-soft);
    font-size:12.5px; color:var(--text-dim);
  }
  .pane-bar .tools{ display:flex; gap:8px; }
  .pill-btn{
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border-soft);
    color:var(--text-dim);
    font-size:12px;
    padding:5px 11px;
    border-radius:8px;
    cursor:pointer;
    transition:background .12s, color .12s;
  }
  .pill-btn:hover{ background:rgba(255,255,255,0.09); color:var(--text); }
  .pill-btn.run{
    background:var(--accent); color:#0A0A0C; border:none; font-weight:600;
  }
  .pill-btn.run:hover{ filter:brightness(1.08); }

  textarea.code-input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:"SF Mono", Menlo, Consolas, monospace;
    font-size:13.5px;
    line-height:1.6;
    padding:16px;
  }
  .console-body{
    flex:1;
    padding:16px;
    font-family:"SF Mono", Menlo, Consolas, monospace;
    font-size:13px;
    line-height:1.7;
    overflow-y:auto;
    color:var(--text-dim);
  }
  .console-body .err{ color:var(--red); }
  .console-body .ok{ color:var(--green); }
  .console-body .sys{ color:var(--text-faint); }

  .autocomplete-box{
    position:absolute;
    background:rgba(28,28,32,0.95);
    border:1px solid var(--border);
    border-radius:9px;
    padding:5px;
    font-family:"SF Mono", Menlo, Consolas, monospace;
    font-size:13px;
    backdrop-filter:blur(20px);
    box-shadow:0 12px 30px rgba(0,0,0,0.5);
    display:none;
    z-index:50;
  }
  .autocomplete-item{
    padding:6px 10px; border-radius:6px; cursor:pointer; color:var(--text-dim);
  }
  .autocomplete-item:hover, .autocomplete-item.sel{
    background:rgba(94,158,255,0.16); color:var(--text);
  }

  /* ---------- Category grid (landing per section) ---------- */
  .lang-tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .lang-tab{
    padding:7px 14px; border-radius:9px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border-soft);
    font-size:13px; color:var(--text-dim);
    cursor:pointer;
  }
  .lang-tab.active{ background:rgba(94,158,255,0.16); color:var(--text); border-color:rgba(94,158,255,0.3); }

  /* ---------- Hosting section ---------- */
  .site-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border-soft);
    margin-bottom:10px;
  }
  .site-row .link{ color:var(--accent); font-size:13.5px; font-family:"SF Mono", Menlo, monospace; }
  .site-row .name{ font-size:14px; font-weight:500; margin-bottom:3px; }
  .site-row .actions{ display:flex; gap:8px; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-faint);
  }
  .empty-state .big{ font-size:15px; color:var(--text-dim); margin-bottom:4px; }

  /* ---------- Discord tool ---------- */
  .discord-form{ max-width:560px; }
  .field textarea{
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border-soft);
    border-radius:11px;
    padding:12px 14px;
    color:var(--text);
    font-size:14px;
    outline:none;
    resize:vertical;
    min-height:90px;
    font-family:inherit;
  }
  .field textarea:focus, .field input:focus{ border-color:rgba(94,158,255,0.55); }

  .embed-preview{
    border-left:3px solid var(--accent);
    background:rgba(255,255,255,0.03);
    border-radius:8px;
    padding:14px 16px;
    margin-top:16px;
  }
  .embed-preview .etitle{ font-weight:600; font-size:14.5px; margin-bottom:6px; color:#fff; }
  .embed-preview .edesc{ font-size:13.5px; color:#dcdde0; line-height:1.5; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(28,28,32,0.92);
    border:1px solid var(--border);
    padding:12px 20px;
    border-radius:12px;
    font-size:13.5px;
    backdrop-filter:blur(20px);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:200;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   ÉTAT & DONNÉES (mock — sera remplacé par les appels Worker)
   ========================================================= */
const state = {
  user: null,
  accounts: JSON.parse(localStorage.getItem('forge_accounts') || '{}'),
  section: 'overview',
  luaLang: 'luau',
  sites: JSON.parse(localStorage.getItem('forge_sites') || '[]'),
  savedWebhook: localStorage.getItem('forge_webhook') || ''
};

// Compte owner initial garanti
if(!state.accounts['spyuhq']){
  state.accounts['spyuhq'] = { password:null, role:'owner', firstLogin:true };
  localStorage.setItem('forge_accounts', JSON.stringify(state.accounts));
}

function saveAccounts(){ localStorage.setItem('forge_accounts', JSON.stringify(state.accounts)); }
function saveSites(){ localStorage.setItem('forge_sites', JSON.stringify(state.sites)); }

const LUA_KEYWORDS = ["local","function","end","if","then","else","elseif","for","while","do","return","true","false","nil","and","or","not","repeat","until","break","print"];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* =========================================================
   RENDER: LOGIN
   ========================================================= */
function renderLogin(mode){
  mode = mode || 'login';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-mark">F</div>
        <h1>${mode==='login' ? 'Connexion' : 'Créer un compte'}</h1>
        <p class="sub">${mode==='login' ? 'Accède à ton espace Forge.' : 'Choisis un pseudo et un mot de passe.'}</p>
        <div class="field">
          <label>Pseudo</label>
          <input id="in-user" type="text" placeholder="ex : spyuhq" autocomplete="username">
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input id="in-pass" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="submit-btn">${mode==='login' ? 'Se connecter' : "S'inscrire"}</button>
        <div class="login-error" id="login-err"></div>
        <div class="login-toggle">
          ${mode==='login' ? `Pas de compte ? <span id="toggle-mode">Créer un compte</span>` : `Déjà un compte ? <span id="toggle-mode">Se connecter</span>`}
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  `;

  document.getElementById('toggle-mode').onclick = ()=> renderLogin(mode==='login' ? 'register' : 'login');

  document.getElementById('submit-btn').onclick = ()=>{
    const u = document.getElementById('in-user').value.trim();
    const p = document.getElementById('in-pass').value;
    const err = document.getElementById('login-err');
    if(!u || !p){ err.textContent = 'Remplis le pseudo et le mot de passe.'; err.style.display='block'; return; }

    if(mode === 'register'){
      if(state.accounts[u]){ err.textContent = 'Ce pseudo existe déjà.'; err.style.display='block'; return; }
      state.accounts[u] = { password:p, role:'member', firstLogin:false };
      saveAccounts();
      state.user = { username:u, role:'member' };
      renderMain();
    } else {
      const acc = state.accounts[u];
      if(!acc){ err.textContent = 'Compte introuvable.'; err.style.display='block'; return; }
      // Première connexion owner : on définit le mot de passe
      if(acc.password === null){
        acc.password = p;
        acc.firstLogin = false;
        saveAccounts();
      } else if(acc.password !== p){
        err.textContent = 'Mot de passe incorrect.'; err.style.display='block'; return;
      }
      state.user = { username:u, role:acc.role };
      renderMain();
    }
  };
}

/* =========================================================
   RENDER: MAIN LAYOUT
   ========================================================= */
const NAV = [
  { group:'Général', items:[
    { id:'overview', label:'Aperçu' },
  ]},
  { group:'Code', items:[
    { id:'lua', label:'Lua' },
    { id:'devtools', label:'Dev Tools' },
  ]},
  { group:'Hébergement', items:[
    { id:'hosting', label:'Sites hébergés' },
  ]},
  { group:'Outils', items:[
    { id:'discord', label:'Annonce Discord' },
  ]},
];

function renderMain(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="main-layout">
      <div class="sidebar">
        <div class="sidebar-header">
          <div class="mark">F</div>
          <div class="name">Forge</div>
        </div>
        <div id="nav-container"></div>
        <div class="sidebar-footer">
          <div class="avatar">${state.user.username.slice(0,2).toUpperCase()}</div>
          <div class="user-meta">
            <div class="uname">${state.user.username}</div>
            <div class="urole">${state.user.role === 'owner' ? 'Owner' : 'Membre'}</div>
          </div>
          <div class="logout-btn" id="logout-btn">Quitter</div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
    <div class="toast" id="toast"></div>
  `;
  renderNav();
  renderSection(state.section);

  document.getElementById('logout-btn').onclick = ()=>{
    state.user = null;
    renderLogin('login');
  };
}

function renderNav(){
  const c = document.getElementById('nav-container');
  c.innerHTML = NAV.map(g => `
    <div class="nav-group">
      <div class="nav-label">${g.group}</div>
      ${g.items.map(it => `
        <div class="nav-item ${state.section===it.id?'active':''}" data-id="${it.id}">
          <span class="dot"></span><span>${it.label}</span>
        </div>
      `).join('')}
    </div>
  `).join('');
  c.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick = ()=>{ state.section = el.dataset.id; renderNav(); renderSection(state.section); };
  });
}

function renderSection(id){
  const c = document.getElementById('content');
  if(id === 'overview') return renderOverview(c);
  if(id === 'lua') return renderCodeEditor(c, 'lua');
  if(id === 'devtools') return renderCodeEditor(c, 'devtools');
  if(id === 'hosting') return renderHosting(c);
  if(id === 'discord') return renderDiscord(c);
}

/* ---------- Overview ---------- */
function renderOverview(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Bonjour, ${state.user.username}</h2>
      <p>Vue d'ensemble de ton espace. Chaque outil est accessible depuis le menu à gauche.</p>
    </div>
    <div class="grid-cards">
      <div class="stat-card">
        <div class="label">Sites hébergés</div>
        <div class="value accent">${state.sites.length}</div>
      </div>
      <div class="stat-card">
        <div class="label">Rôle</div>
        <div class="value">${state.user.role === 'owner' ? 'Owner' : 'Membre'}</div>
      </div>
      <div class="stat-card">
        <div class="label">Webhook Discord</div>
        <div class="value">${state.savedWebhook ? 'Enregistré' : 'Aucun'}</div>
      </div>
    </div>
  `;
}

/* ---------- Lua / Dev tools editor ---------- */
function renderCodeEditor(c, kind){
  const isLua = kind === 'lua';
  const langs = isLua
    ? [{id:'luau', label:'LuaU'},{id:'roblox', label:'Roblox Studio'},{id:'gtarp', label:'GTA RP'},{id:'delta', label:'Delta Exécuteur'}]
    : [{id:'python', label:'Python'},{id:'javascript', label:'JavaScript'}];

  c.innerHTML = `
    <div class="content-header">
      <h2>${isLua ? 'Éditeur Lua' : 'Dev Tools'}</h2>
      <p>${isLua ? "Écris ton script, exécute-le et regarde la console simuler l'interface du script." : "Exécute du Python ou du JS et regarde le résultat dans la console."}</p>
    </div>
    <div class="lang-tabs" id="lang-tabs">
      ${langs.map((l,i)=> `<div class="lang-tab ${i===0?'active':''}" data-lang="${l.id}">${l.label}</div>`).join('')}
    </div>
    <div class="editor-wrap">
      <div class="editor-pane">
        <div class="pane-bar">
          <span>Script</span>
          <div class="tools">
            <button class="pill-btn" id="dl-btn">Télécharger</button>
            <button class="pill-btn run" id="run-btn">Exécuter</button>
          </div>
        </div>
        <textarea class="code-input" id="code-input" spellcheck="false" placeholder="${isLua ? '-- écris ton script Lua ici\\nloca' : '# écris ton script ici'}"></textarea>
      </div>
      <div class="console-pane">
        <div class="pane-bar">
          <span>Console</span>
          <div class="tools">
            <button class="pill-btn" id="copy-console">Copier</button>
            <button class="pill-btn" id="clear-console">Vider</button>
          </div>
        </div>
        <div class="console-body" id="console-body">
          <div class="sys">// La console s'affichera ici après exécution.</div>
        </div>
      </div>
    </div>
    <div class="autocomplete-box" id="autocomplete"></div>
  `;

  c.querySelectorAll('#lang-tabs .lang-tab').forEach(el=>{
    el.onclick = ()=>{
      c.querySelectorAll('#lang-tabs .lang-tab').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
    };
  });

  const input = document.getElementById('code-input');
  const autoBox = document.getElementById('autocomplete');

  if(isLua){
    input.addEventListener('keyup', (e)=>{
      const val = input.value;
      const pos = input.selectionStart;
      const before = val.slice(0, pos);
      const match = before.match(/[a-zA-Z_]+$/);
      if(match && match[0].length >= 2){
        const word = match[0];
        const sugg = LUA_KEYWORDS.filter(k => k.startsWith(word) && k !== word);
        if(sugg.length){
          autoBox.style.display = 'block';
          autoBox.style.left = '30px';
          autoBox.style.top = '46px';
          autoBox.innerHTML = sugg.slice(0,6).map(s => `<div class="autocomplete-item" data-word="${s}">${s}</div>`).join('');
          autoBox.querySelectorAll('.autocomplete-item').forEach(item=>{
            item.onclick = ()=>{
              const w = item.dataset.word;
              input.value = before.slice(0, before.length - word.length) + w + val.slice(pos);
              autoBox.style.display = 'none';
              input.focus();
            };
          });
          return;
        }
      }
      autoBox.style.display = 'none';
    });
    input.addEventListener('blur', ()=> setTimeout(()=> autoBox.style.display='none', 150));
  }

  document.getElementById('run-btn').onclick = ()=>{
    const body = document.getElementById('console-body');
    const code = input.value;
    if(!code.trim()){
      body.innerHTML = `<div class="err">Erreur : aucun code à exécuter.</div>`;
      return;
    }
    body.innerHTML = `
      <div class="sys">// Exécution simulée — le vrai moteur d'exécution sera branché ici (Piston / interpréteur WASM)</div>
      <div class="ok">✓ Script chargé sans erreur de syntaxe apparente.</div>
      <div class="sys">// Sortie GUI simulée (placeholder) :</div>
      <div style="margin-top:8px; padding:12px; border:1px dashed rgba(255,255,255,0.15); border-radius:8px; color:#93939B;">[ Fenêtre GUI simulée du script ]</div>
    `;
  };

  document.getElementById('dl-btn').onclick = ()=>{
    const ext = isLua ? 'lua' : 'txt';
    const blob = new Blob([input.value], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `script.${ext}`;
    a.click();
  };

  document.getElementById('copy-console').onclick = ()=>{
    navigator.clipboard.writeText(document.getElementById('console-body').innerText);
    toast('Console copiée');
  };
  document.getElementById('clear-console').onclick = ()=>{
    document.getElementById('console-body').innerHTML = `<div class="sys">// Console vidée.</div>`;
  };
}

/* ---------- Hosting ---------- */
function renderHosting(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Sites hébergés</h2>
      <p>Crée un mini-site HTML et reçois un lien généré par la backend pour y accéder.</p>
    </div>
    <div class="panel" style="margin-bottom:18px;">
      <div class="field" style="margin-bottom:10px;">
        <label>Nom du site</label>
        <input id="site-name" type="text" placeholder="mon-super-site">
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label>Code HTML</label>
        <textarea id="site-html" placeholder="<h1>Hello world</h1>" style="min-height:120px; width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border-soft); border-radius:11px; padding:12px 14px; color:var(--text); font-family:'SF Mono', monospace; font-size:13px; outline:none; resize:vertical;"></textarea>
      </div>
      <button class="pill-btn run" id="publish-btn">Publier</button>
    </div>
    <div id="sites-list"></div>
  `;

  function renderList(){
    const list = document.getElementById('sites-list');
    if(!state.sites.length){
      list.innerHTML = `<div class="empty-state"><div class="big">Aucun site publié</div>Crée ton premier site ci-dessus.</div>`;
      return;
    }
    list.innerHTML = state.sites.map((s,i) => `
      <div class="site-row">
        <div>
          <div class="name">${s.name}</div>
          <div class="link">host.spyuhq.workers.dev/site/${s.id}</div>
        </div>
        <div class="actions">
          <button class="pill-btn" data-copy="${i}">Copier le lien</button>
          <button class="pill-btn" data-del="${i}">Supprimer</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('[data-copy]').forEach(btn=>{
      btn.onclick = ()=>{
        const s = state.sites[btn.dataset.copy];
        navigator.clipboard.writeText(`https://host.spyuhq.workers.dev/site/${s.id}`);
        toast('Lien copié');
      };
    });
    list.querySelectorAll('[data-del]').forEach(btn=>{
      btn.onclick = ()=>{
        state.sites.splice(btn.dataset.del, 1);
        saveSites();
        renderList();
      };
    });
  }
  renderList();

  document.getElementById('publish-btn').onclick = ()=>{
    const name = document.getElementById('site-name').value.trim();
    const html = document.getElementById('site-html').value;
    if(!name){ toast('Donne un nom au site'); return; }
    const id = Math.random().toString(36).slice(2,9);
    state.sites.push({ id, name, html });
    saveSites();
    document.getElementById('site-name').value = '';
    document.getElementById('site-html').value = '';
    toast('Site publié (mock local — pas encore connecté au Worker)');
    renderList();
  };
}

/* ---------- Discord announce tool ---------- */
function renderDiscord(c){
  c.innerHTML = `
    <div class="content-header">
      <h2>Annonce Discord</h2>
      <p>Envoie un embed via un webhook Discord. Le webhook est sauvegardé localement pour la prochaine fois.</p>
    </div>
    <div class="panel discord-form">
      <div class="field">
        <label>Webhook Discord</label>
        <input id="wh-url" type="text" placeholder="https://discord.com/api/webhooks/..." value="${state.savedWebhook}">
      </div>
      <div class="field">
        <label>Titre de l'embed</label>
        <input id="embed-title" type="text" placeholder="Titre de l'annonce">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="embed-desc" placeholder="Contenu de l'annonce..."></textarea>
      </div>
      <button class="pill-btn run" id="send-btn">Envoyer l'annonce</button>
      <div class="embed-preview" id="preview" style="display:none;">
        <div class="etitle" id="pv-title"></div>
        <div class="edesc" id="pv-desc"></div>
      </div>
    </div>
  `;

  const titleI = document.getElementById('embed-title');
  const descI = document.getElementById('embed-desc');
  function updatePreview(){
    const t = titleI.value, d = descI.value;
    if(!t && !d){ document.getElementById('preview').style.display='none'; return; }
    document.getElementById('preview').style.display='block';
    document.getElementById('pv-title').textContent = t;
    document.getElementById('pv-desc').textContent = d;
  }
  titleI.oninput = updatePreview;
  descI.oninput = updatePreview;

  document.getElementById('send-btn').onclick = async ()=>{
    const url = document.getElementById('wh-url').value.trim();
    const title = titleI.value.trim();
    const desc = descI.value.trim();
    if(!url){ toast('Colle un lien de webhook'); return; }
    if(!title && !desc){ toast("Ajoute un titre ou une description"); return; }

    localStorage.setItem('forge_webhook', url);
    state.savedWebhook = url;

    try{
      await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ embeds:[{ title, description:desc, color: 6216447 }] })
      });
      toast('Annonce envoyée');
    } catch(e){
      toast("Erreur d'envoi — vérifie le lien du webhook");
    }
  };
}
