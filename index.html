<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpyHub Loader</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07090d;color:#e6edf3;font-family:system-ui,sans-serif;padding:16px;max-width:760px;margin:auto}
h1{font-size:22px;margin:8px 0 16px;color:#00ffc6}
.card{background:#0f141b;border:1px solid #1d2733;border-radius:12px;padding:14px;margin-bottom:14px}
input,textarea{width:100%;background:#0a0e14;color:#e6edf3;border:1px solid #1d2733;border-radius:8px;padding:10px;font-size:14px;margin-bottom:8px}
textarea{height:240px;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:vertical}
button{background:#00ffc6;color:#04120d;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:14px}
button.sec{background:#1d2733;color:#e6edf3}
button.del{background:#3a1218;color:#ff6b7a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code{background:#0a0e14;border:1px dashed #00ffc6;border-radius:8px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;margin:8px 0}
.item{border-top:1px solid #1d2733;padding:10px 0}
.item:first-child{border-top:0}
.muted{color:#7d8a99;font-size:12px}
#msg{color:#ff6b7a;font-size:13px;min-height:18px}
.hide{display:none}
</style></head><body>
<h1>SpyHub Loader</h1>

<div id="login" class="card">
  <div class="muted" style="margin-bottom:8px">Mot de passe admin</div>
  <input id="pw" type="password" placeholder="Mot de passe">
  <button id="go">Connexion</button>
</div>

<div id="app" class="hide">
  <div class="card">
    <input id="name" placeholder="Nom du script (ex : Scanner v5)" maxlength="60">
    <textarea id="code" placeholder="Colle ton code Lua ici"></textarea>
    <div class="row">
      <button id="save">Créer</button>
      <button id="cancel" class="sec hide">Annuler la modification</button>
    </div>
    <div id="result" class="hide">
      <div class="muted" style="margin-top:10px">Ton loadstring :</div>
      <div id="line" class="code"></div>
      <button id="copyline">Copier</button>
    </div>
  </div>
  <div class="card"><b>Mes scripts</b><div id="list" style="margin-top:6px"></div></div>
</div>
<div id="msg"></div>

<script>
// ⚠️ Mets ici l'adresse de ton Worker (sans "/" à la fin)
var WORKER = "https://spyhub-aj.spyuhq.workers.dev";

var pw = localStorage.getItem("pw") || "", editId = "";
var $ = function (s) { return document.querySelector(s); };
function msg(t) { $("#msg").textContent = t || ""; }

// Appel de l'API du Worker (mot de passe envoyé dans un en-tête)
function api(path, body) {
  return fetch(WORKER + "/api/" + path, {
    method: "POST",
    headers: { "x-admin": pw, "content-type": "application/json" },
    body: JSON.stringify(body || {})
  }).then(function (r) {
    if (r.status === 401) { pw = ""; localStorage.removeItem("pw"); show(false); throw new Error("Mot de passe refusé"); }
    return r.json();
  });
}
function show(on) { $("#login").classList.toggle("hide", on); $("#app").classList.toggle("hide", !on); }
function lineOf(id) { return 'loadstring(game:HttpGet("' + WORKER + '/raw/' + id + '"))()'; }
function copy(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { msg("Copié !"); }, function () { prompt("Copie :", t); });
  else prompt("Copie :", t);
}
function resetForm() {
  editId = ""; $("#name").value = ""; $("#code").value = "";
  $("#save").textContent = "Créer"; $("#cancel").classList.add("hide");
}

// Liste des scripts
function refresh() {
  return api("list").then(function (d) {
    var box = $("#list"); box.innerHTML = "";
    if (!d.list || !d.list.length) { box.innerHTML = '<div class="muted">Aucun script pour le moment.</div>'; return; }
    d.list.forEach(function (s) {
      var it = document.createElement("div"); it.className = "item";
      var t = document.createElement("div"); t.textContent = s.name || "(sans nom)";
      var m = document.createElement("div"); m.className = "muted"; m.textContent = new Date(s.ts).toLocaleString();
      var r = document.createElement("div"); r.className = "row"; r.style.marginTop = "6px";
      [["Copier le loadstring", "sec", function () { copy(lineOf(s.id)); }],
       ["Modifier", "sec", function () { edit(s.id); }],
       ["Supprimer", "del", function () { if (confirm("Supprimer ce script ?")) api("delete", { id: s.id }).then(refresh); }]
      ].forEach(function (b) {
        var bt = document.createElement("button"); bt.textContent = b[0]; bt.className = b[1]; bt.onclick = b[2]; r.appendChild(bt);
      });
      it.appendChild(t); it.appendChild(m); it.appendChild(r); box.appendChild(it);
    });
  });
}
function edit(id) {
  api("get", { id: id }).then(function (d) {
    editId = id; $("#name").value = d.name || ""; $("#code").value = d.code || "";
    $("#save").textContent = "Enregistrer"; $("#cancel").classList.remove("hide");
    $("#result").classList.add("hide"); window.scrollTo(0, 0);
  });
}

$("#go").onclick = function () {
  pw = $("#pw").value; msg("");
  api("list").then(function () { localStorage.setItem("pw", pw); show(true); refresh(); }).catch(function (e) { msg(e.message); });
};
$("#save").onclick = function () {
  msg("");
  api("save", { id: editId, name: $("#name").value, code: $("#code").value }).then(function (d) {
    if (!d.ok) return msg(d.error || "Erreur");
    $("#line").textContent = lineOf(d.id); $("#result").classList.remove("hide"); $("#copyline").onclick = function () { copy(lineOf(d.id)); };
    resetForm(); refresh();
  }).catch(function (e) { msg(e.message); });
};
$("#cancel").onclick = resetForm;

if (WORKER.indexOf("T") > -1) {
  msg("Ouvre loader.html et remplace TON-WORKER par l'adresse de ton Worker (ligne WORKER).");
} else if (pw) {
  api("list").then(function () { show(true); refresh(); }).catch(function () {});
}
</script></body></html>
