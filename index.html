<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Legacy — Control Panel</title>
  <style>
    :root{
      --bg:#070711;--panel:#10101d;--panel2:#151526;--line:#28283d;
      --text:#f4f1ff;--muted:#9995b2;--purple:#9b7cff;--purple2:#6d43e8;
      --green:#42d99b;--red:#ff6f7f;--yellow:#ffc85c;--blue:#6eb8ff;
      --shadow:0 18px 60px #0008
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,sans-serif}
    body{background-image:radial-gradient(#8d6cff18 1px,transparent 1px);background-size:26px 26px}
    button,input,textarea,select{font:inherit}button{cursor:pointer}
    .hidden{display:none!important}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .auth{min-height:100vh;display:grid;place-items:center;padding:24px}
    .auth-box{width:min(440px,100%);background:#0f0e1cdd;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
    .brand{display:flex;gap:12px;align-items:center;font-weight:750;letter-spacing:-.3px;font-size:18px}
    .brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple2),var(--purple));box-shadow:0 8px 28px #7048e855}
    .brand-mark:after{content:"L";font-weight:800;color:#fff}.auth h1{font-size:26px;margin:34px 0 8px;letter-spacing:-.8px}.auth p{color:var(--muted);line-height:1.55}
    .tabs{display:flex;gap:4px;background:#ffffff08;border:1px solid var(--line);padding:4px;border-radius:12px;margin:24px 0}
    .tabs button{flex:1;border:0;border-radius:9px;padding:9px;background:transparent;color:var(--muted)}
    .tabs button.active{background:#8d6cff2e;color:#dcd3ff}
    label{display:block;color:var(--muted);font-size:12px;margin:14px 0 7px}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:var(--text);padding:11px 12px;outline:0}
    .input:focus,.select:focus,.textarea:focus{border-color:#9b7cffaa;box-shadow:0 0 0 3px #9b7cff1c}.textarea{min-height:100px;resize:vertical}
    .btn{border:1px solid var(--line);border-radius:10px;background:#ffffff09;color:var(--text);padding:10px 14px;transition:.16s}
    .btn:hover{background:#ffffff16;border-color:#9b7cff66}.btn.primary{border:0;background:linear-gradient(135deg,var(--purple2),var(--purple));box-shadow:0 7px 22px #7448e833}.btn.danger{color:var(--red);border-color:#ff6f7f44}.btn.success{color:var(--green);border-color:#42d99b44}.btn.small{padding:6px 9px;font-size:12px}
    .notice{border-radius:10px;padding:11px 12px;font-size:12px;margin-top:14px}.notice.error{background:#ff6f7f12;border:1px solid #ff6f7f38;color:#ffabb4}.notice.ok{background:#42d99b12;border:1px solid #42d99b38;color:#8ce8bd}
    .shell{min-height:100vh}.topbar{height:64px;border-bottom:1px solid var(--line);background:#090914e8;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:3}
    .top-actions{display:flex;gap:9px;align-items:center}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--muted);font-size:11px}.pill.owner{color:#dccfff;border-color:#9b7cff55;background:#9b7cff12}.pill.admin{color:#8fc8ff;border-color:#6eb8ff55;background:#6eb8ff12}
    .layout{display:flex;min-height:calc(100vh - 64px)}.side{width:220px;border-right:1px solid var(--line);padding:18px 12px;flex:none;background:#09091499}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#77728f;padding:13px 12px 7px}.nav{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:9px;margin:2px 0}.nav:hover,.nav.active{color:#eee8ff;background:#9b7cff1c}.main{width:min(1180px,100%);padding:28px;margin:0 auto;flex:1}.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.page-title h2{margin:0 0 5px;font-size:25px;letter-spacing:-.7px}.page-title p{margin:0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card{background:#10101ddd;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 8px 30px #0002}.stat-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}.stat-value{font-size:28px;margin-top:9px;font-weight:700;color:#ddd2ff}.stat-value.green{color:var(--green)}.stat-value.red{color:var(--red)}.stat-value.blue{color:var(--blue)}
    .split{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card h3{font-size:14px;margin:0 0 15px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>.fit{flex:0 0 auto}.stack{display:grid;gap:10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
    .table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:#88849f;font-weight:500;border-bottom:1px solid var(--line);padding:9px 8px;white-space:nowrap}.table td{border-bottom:1px solid #28283d88;padding:11px 8px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:25px 8px}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#ffffff0b;color:var(--muted);font-size:11px}.tag.green{color:var(--green);background:#42d99b12}.tag.red{color:var(--red);background:#ff6f7f12}.tag.yellow{color:var(--yellow);background:#ffc85c12}
    .list{display:grid;gap:8px}.event{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #28283d88}.event:last-child{border-bottom:0}.event strong{font-weight:550}.event small{color:var(--muted);white-space:nowrap}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.check input{accent-color:var(--purple)}
    .toast{position:fixed;right:20px;bottom:20px;z-index:8;max-width:360px;border:1px solid var(--line);border-radius:11px;background:#171526f2;padding:12px 14px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.toast.error{border-color:#ff6f7f66;color:#ffbbc2}.toast.ok{border-color:#42d99b66;color:#a3efca}
    .ticket-box{word-break:break-all;background:#080811;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;color:#c6baff}
    @media(max-width:900px){.side{width:66px;padding:12px 8px}.nav{font-size:0;text-align:center}.nav:before{content:"•";font-size:20px}.nav-label{font-size:0}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.main{padding:20px 14px}.topbar{padding:0 14px}.brand span{display:none}}
    @media(max-width:560px){.form-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.topbar .pill{display:none}.page-title{display:block}.page-title .row{margin-top:15px}}
  </style>
</head>
<body>
  <section id="auth" class="auth">
    <div class="auth-box">
      <div class="brand"><div class="brand-mark"></div><span>Legacy Control Panel</span></div>
      <h1 id="auth-title">Connexion</h1>
      <p id="auth-sub">Accède au panneau de supervision.</p>
      <div class="tabs"><button id="login-tab" class="active" data-auth="login">Connexion</button><button id="register-tab" data-auth="register">Créer un compte</button></div>
      <form id="auth-form">
        <label for="auth-user">Nom d’utilisateur</label>
        <input class="input" id="auth-user" autocomplete="username" minlength="3" maxlength="32" required>
        <label for="auth-pass">Mot de passe</label>
        <input class="input" id="auth-pass" type="password" autocomplete="current-password" minlength="12" required>
        <div id="bootstrap-wrap" class="hidden">
          <label for="bootstrap-secret">Secret de bootstrap owner</label>
          <input class="input" id="bootstrap-secret" type="password" autocomplete="off">
          <p class="muted" style="font-size:11px">Uniquement pour créer le premier compte.</p>
        </div>
        <button class="btn primary" style="width:100%;margin-top:18px" id="auth-submit">Se connecter</button>
        <div id="auth-message"></div>
      </form>
    </div>
  </section>

  <section id="app" class="shell hidden">
    <header class="topbar">
      <div class="brand"><div class="brand-mark"></div><span>Legacy Control Panel</span></div>
      <div class="top-actions"><span id="user-pill" class="pill"></span><span id="role-pill" class="pill"></span><button id="logout" class="btn small">Déconnexion</button></div>
    </header>
    <div class="layout">
      <aside class="side">
        <div class="nav-label">Panel</div>
        <button class="nav active" data-page="overview">Overview</button>
        <button class="nav" data-page="players">Players</button>
        <button class="nav" data-page="bans">Bans</button>
        <button class="nav admin-only hidden" data-page="bots">Bots</button>
        <button class="nav" data-page="logs">Logs</button>
        <button class="nav owner-only hidden" data-page="accounts">Accounts</button>
        <button class="nav" data-page="tickets">Tickets</button>
        <div class="nav-label">Compte</div>
        <button class="nav" data-page="settings">Settings</button>
      </aside>
      <main id="main" class="main"></main>
    </div>
  </section>
  <div id="toast" class="toast"></div>

  <script>
    (() => {
      "use strict";
      const qs = (s, el = document) => el.querySelector(s);
      const qsa = (s, el = document) => [...el.querySelectorAll(s)];
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const date = (v) => v ? new Date(Number(v)).toLocaleString("fr-FR") : "—";
      const W = (window.LEGACY_WORKER_URL || localStorage.getItem("legacy_worker_url") || prompt("URL du Worker Cloudflare (ex: https://legacy.example.workers.dev)"))?.replace(/\/+$/, "");
      if (W) localStorage.setItem("legacy_worker_url", W);

      const state = {
        token: sessionStorage.getItem("legacy_token"),
        username: sessionStorage.getItem("legacy_username"),
        role: sessionStorage.getItem("legacy_role"),
        plan: sessionStorage.getItem("legacy_plan"),
        page: "overview",
        stats: null,
        me: null,
        accounts: null,
      };

      function toast(message, kind = "ok") {
        const el = qs("#toast"); el.textContent = message; el.className = "toast show " + kind;
        clearTimeout(toast.timer); toast.timer = setTimeout(() => el.className = "toast", 3500);
      }
      function authMessage(message, kind = "error") {
        qs("#auth-message").className = "notice " + kind; qs("#auth-message").textContent = message;
      }
      function saveAuth(data) {
        state.token = data.token; state.username = data.username; state.role = data.role; state.plan = data.plan;
        sessionStorage.setItem("legacy_token", state.token);
        sessionStorage.setItem("legacy_username", state.username);
        sessionStorage.setItem("legacy_role", state.role);
        sessionStorage.setItem("legacy_plan", state.plan || "free");
      }
      function clearAuth() {
        Object.keys(state).forEach(k => { if (["token","username","role","plan"].includes(k)) state[k] = null; });
        ["legacy_token","legacy_username","legacy_role","legacy_plan"].forEach(k => sessionStorage.removeItem(k));
      }
      async function api(path, method = "GET", payload) {
        if (!W) throw new Error("URL du Worker manquante");
        const options = {method, headers: {"Authorization": "Bearer " + state.token}};
        if (payload !== undefined) { options.headers["Content-Type"] = "application/json"; options.body = JSON.stringify(payload); }
        const response = await fetch(W + path, options);
        let data = {}; try { data = await response.json(); } catch {}
        if (response.status === 401) { clearAuth(); showAuth(); throw new Error("Session expirée"); }
        if (!response.ok) throw new Error(data.error || "Erreur serveur");
        return data;
      }
      function showAuth() {
        qs("#auth").classList.remove("hidden"); qs("#app").classList.add("hidden");
      }
      function showApp() {
        qs("#auth").classList.add("hidden"); qs("#app").classList.remove("hidden");
        qs("#user-pill").textContent = state.username || "user";
        qs("#role-pill").textContent = (state.role || "user") + (state.plan ? " · " + state.plan : "");
        qs("#role-pill").className = "pill " + (state.role === "owner" ? "owner" : state.role === "admin" ? "admin" : "");
        qsa(".owner-only").forEach(el => el.classList.toggle("hidden", state.role !== "owner"));
        qsa(".admin-only").forEach(el => el.classList.toggle("hidden", !["owner","admin"].includes(state.role)));
        go(state.page);
      }
      function setAuthMode(mode) {
        const register = mode === "register";
        qs("#login-tab").classList.toggle("active", !register); qs("#register-tab").classList.toggle("active", register);
        qs("#auth-title").textContent = register ? "Créer un compte" : "Connexion";
        qs("#auth-sub").textContent = register ? "Le premier compte nécessite le secret de bootstrap." : "Accède au panneau de supervision.";
        qs("#auth-submit").textContent = register ? "Créer le compte" : "Se connecter";
        qs("#bootstrap-wrap").classList.toggle("hidden", !register);
        qs("#auth-pass").setAttribute("autocomplete", register ? "new-password" : "current-password");
        qs("#auth-message").className = ""; qs("#auth-message").textContent = "";
      }
      qsa("[data-auth]").forEach(btn => btn.addEventListener("click", () => setAuthMode(btn.dataset.auth)));
      qs("#auth-form").addEventListener("submit", async e => {
        e.preventDefault();
        const register = qs("#register-tab").classList.contains("active");
        const username = qs("#auth-user").value.trim(), password = qs("#auth-pass").value;
        if (password.length < 12) return authMessage("Le mot de passe doit contenir au moins 12 caractères.");
        try {
          const payload = {username, password};
          if (register) payload.bootstrapSecret = qs("#bootstrap-secret").value;
          const data = await fetch(W + (register ? "/api/register" : "/api/login"), {
            method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload)
          }).then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.error || "Erreur"); return d; });
          saveAuth(data); showApp();
        } catch (error) { authMessage(error.message); }
      });
      qs("#logout").addEventListener("click", () => { clearAuth(); showAuth(); });
      qsa("[data-page]").forEach(btn => btn.addEventListener("click", () => go(btn.dataset.page)));

      async function loadStats() { state.stats = await api("/api/stats"); return state.stats; }
      function pageHead(title, sub, action = "") {
        return `<div class="page-title"><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>${action}</div>`;
      }
      function metric(label, value, cls = "") { return `<div class="card"><div class="stat-label">${esc(label)}</div><div class="stat-value ${cls}">${esc(value)}</div></div>`; }
      function emptyRow(cols, text = "Aucune donnée") { return `<tr><td colspan="${cols}" class="empty">${esc(text)}</td></tr>`; }

      async function renderOverview() {
        const d = await loadStats();
        qs("#main").innerHTML = pageHead("Overview", "Vue d’ensemble de l’activité récente.", `<button class="btn small" id="refresh">Actualiser</button>`) +
          `<div class="grid">${metric("Exécutions", d.total)}${metric("Joueurs uniques", d.uniquePlayers, "blue")}${metric("En ligne · 5 min", d.onlinePlayers?.length || 0, "green")}${metric("Joueurs bannis", d.bannedCount, "red")}</div>
          <div class="split"><section class="card"><h3>Dernières exécutions</h3><div class="list">${(d.recentLogs || []).slice(0,8).map(x => `<div class="event"><div><strong>${esc(x.uname || "unknown")}</strong><div class="muted mono">${esc(x.uid)} · ${esc(x.gname || "—")}</div></div><small>${date(x.ts)}</small></div>`).join("") || `<div class="empty">Aucune exécution</div>`}</div></section>
          <section class="card"><h3>Annonce active</h3>${d.announce ? `<p>${esc(d.announce.msg)}</p><span class="tag yellow">Expire ${date(d.announce.expires)}</span>` : `<p class="muted">Aucune annonce active.</p>`}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>État du service</h3><span class="tag ${d.maintenance ? "red" : "green"}">${d.maintenance ? "Maintenance" : "Opérationnel"}</span></section></div>`;
        qs("#refresh").onclick = () => renderOverview().catch(showError);
      }
      async function renderPlayers() {
        const d = await loadStats();
        qs("#main").innerHTML = pageHead("Players", "Joueurs vus dans les événements reçus.") +
          `<section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Joueur</th><th>User ID</th><th>Exécutions</th><th>Dernière activité</th><th>Jeu</th></tr></thead><tbody>${(d.topPlayers || []).map((x,i) => `<tr><td>${i+1}</td><td><strong>${esc(x.uname || "unknown")}</strong></td><td class="mono">${esc(x.uid)}</td><td>${x.count}</td><td>${date(x.last)}</td><td>${esc(x.gname || "—")}</td></tr>`).join("") || emptyRow(6)}</tbody></table></div></section>`;
      }
      async function renderBans() {
        const d = await loadStats(), can = ["owner","admin"].includes(state.role);
        qs("#main").innerHTML = pageHead("Bans", "Contrôle des bannissements actifs.", can ? `<button class="btn primary small" id="new-ban">Nouveau ban</button>` : "") +
          (can ? `<section class="card hidden" id="ban-form"><h3>Bannir un User ID Roblox</h3><form class="form-grid" id="ban-submit"><div><label>User ID</label><input class="input" id="ban-uid" inputmode="numeric" required></div><div><label>Durée en secondes · vide = permanent</label><input class="input" id="ban-duration" type="number" min="1" max="31536000"></div><div class="full"><label>Raison</label><input class="input" id="ban-reason" maxlength="500" required></div><div class="full row"><button class="btn primary fit">Bannir</button><button type="button" class="btn fit" id="cancel-ban">Annuler</button></div></form></section>` : "") +
          `<section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>User ID</th><th>Raison</th><th>Par</th><th>Expiration</th><th></th></tr></thead><tbody>${Object.entries(d.bans || {}).map(([uid,b]) => `<tr><td class="mono">${esc(uid)}</td><td>${esc(b.reason)}</td><td>${esc(b.by)}</td><td>${b.expires ? date(b.expires) : "Permanent"}</td><td>${can ? `<button class="btn small success unban" data-id="${esc(uid)}">Débannir</button>` : ""}</td></tr>`).join("") || emptyRow(5)}</tbody></table></div></section>`;
        if (can) {
          qs("#new-ban").onclick = () => qs("#ban-form").classList.remove("hidden");
          qs("#cancel-ban").onclick = () => qs("#ban-form").classList.add("hidden");
          qs("#ban-submit").onsubmit = async e => { e.preventDefault(); try { await api("/api/ban","POST",{userId:qs("#ban-uid").value.trim(),reason:qs("#ban-reason").value.trim(),duration:qs("#ban-duration").value ? Number(qs("#ban-duration").value) : null}); toast("Bannissement enregistré"); renderBans(); } catch(error){showError(error)} };
          qsa(".unban").forEach(btn => btn.onclick = async () => { try { await api("/api/unban","POST",{userId:btn.dataset.id}); toast("Bannissement retiré"); renderBans(); } catch(error){showError(error)} });
        }
      }
      let botsTimer = null;
      async function renderBots() {
        if (!["owner","admin"].includes(state.role)) return go("overview");
        clearTimeout(botsTimer);
        const d = await api("/api/bots");
        const online = d.online || 0, starting = d.starting || 0;
        qs("#main").innerHTML = pageHead("Bots", "Simulation visuelle de comptes fictifs et de VPS.", `<div class="row"><button class="btn primary small" id="start-bots">Start all</button><button class="btn small" id="stop-bots">Stop all</button></div>`) +
          `<section class="card" style="margin-bottom:14px"><div class="row"><div><strong>Mode simulation uniquement</strong><p class="muted" style="margin:6px 0 0">Aucun cookie, token ou compte Roblox réel n’est utilisé. Les VPS et les statuts sont fictifs.</p></div><span class="tag ${starting ? "yellow" : online ? "green" : ""}">${starting ? starting + " en démarrage" : online + " en ligne"}</span></div></section>
          <section class="card hidden" id="bot-form"><h3>Ajouter un bot fictif</h3><form id="bot-submit" class="form-grid"><div><label>Nom d’affichage</label><input class="input" id="bot-name" maxlength="40" placeholder="Bot EU 01" required></div><div><label>Région VPS</label><select class="select" id="bot-region"><option value="EU">EU</option><option value="US">US</option><option value="AS">AS</option></select></div><div class="full row"><button class="btn primary fit">Ajouter</button><button type="button" class="btn fit" id="cancel-bot">Annuler</button></div></form></section>
          <section class="card"><div class="row" style="margin-bottom:14px"><h3 style="margin:0">Bot accounts fictifs</h3><button class="btn small fit" id="new-bot">Ajouter un bot</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Bot</th><th>VPS</th><th>Région</th><th>Statut</th><th>Uptime</th><th></th></tr></thead><tbody>${(d.bots || []).map(bot => `<tr><td><strong>${esc(bot.name)}</strong><div class="muted mono">${esc(String(bot.id || "").slice(0,8))}</div></td><td class="mono">${esc(bot.vps)}</td><td>${esc(bot.region)}</td><td><span class="tag ${bot.status==="online"?"green":bot.status==="starting"?"yellow":""}">${esc(bot.status)}</span></td><td class="mono">${bot.status==="online" ? formatUptime(bot.uptime) : "—"}</td><td><button class="btn danger small delete-bot" data-id="${esc(bot.id)}">Supprimer</button></td></tr>`).join("") || emptyRow(6, "Ajoute ton premier bot fictif")}</tbody></table></div></section>`;
        qs("#start-bots").onclick = async () => { try { const result = await api("/api/bots/start","POST",{}); toast(result.scheduled ? `Démarrage simulé de ${result.scheduled} bot(s)` : "Aucun bot à démarrer"); renderBots(); } catch(error){showError(error)} };
        qs("#stop-bots").onclick = async () => { try { await api("/api/bots/stop","POST",{}); toast("Simulation arrêtée"); renderBots(); } catch(error){showError(error)} };
        qs("#new-bot").onclick = () => qs("#bot-form").classList.remove("hidden");
        qs("#cancel-bot").onclick = () => qs("#bot-form").classList.add("hidden");
        qs("#bot-submit").onsubmit = async e => { e.preventDefault(); try { await api("/api/bots","POST",{name:qs("#bot-name").value.trim(),region:qs("#bot-region").value}); toast("Bot fictif ajouté"); renderBots(); } catch(error){showError(error)} };
        qsa(".delete-bot").forEach(btn => btn.onclick = async () => { if (!confirm("Supprimer ce bot fictif ?")) return; try { await api("/api/bots/delete","POST",{id:btn.dataset.id}); toast("Bot supprimé"); renderBots(); } catch(error){showError(error)} });
        if (starting) botsTimer = setTimeout(() => renderBots().catch(showError), 3000);
      }
      function formatUptime(seconds) {
        const s = Math.max(0, Number(seconds) || 0), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
      }
      async function renderLogs() {
        const d = await loadStats();
        qs("#main").innerHTML = pageHead("Logs", "Événements et actions administratives.") +
          `<section class="card"><h3>Exécutions</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Joueur</th><th>User ID</th><th>Place ID</th><th>Jeu</th></tr></thead><tbody>${(d.recentLogs || []).map(x => `<tr><td>${date(x.ts)}</td><td>${esc(x.uname || "unknown")}</td><td class="mono">${esc(x.uid)}</td><td class="mono">${esc(x.pid)}</td><td>${esc(x.gname || "—")}</td></tr>`).join("") || emptyRow(5)}</tbody></table></div></section>` +
          (["owner","admin"].includes(state.role) ? `<section class="card" style="margin-top:14px"><h3>Audit admin</h3><div class="list">${(d.auditLog || []).map(x => `<div class="event"><div><strong>${esc(x.action)}</strong><div class="muted">${esc(x.who)} · ${esc(x.detail)}</div></div><small>${date(x.ts)}</small></div>`).join("") || `<div class="empty">Aucune action</div>`}</div></section>` : "");
      }
      async function renderAccounts() {
        if (state.role !== "owner") return go("overview");
        state.accounts = await api("/api/accounts");
        qs("#main").innerHTML = pageHead("Accounts", "Gestion des comptes du panneau.") +
          `<section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Utilisateur</th><th>Rôle</th><th>Plan</th><th>Créé le</th><th>Actions</th></tr></thead><tbody>${(state.accounts.accounts || []).map(a => `<tr><td><strong>${esc(a.username)}</strong></td><td><select class="select role-change" data-user="${esc(a.username)}"><option ${a.role==="user"?"selected":""} value="user">user</option><option ${a.role==="admin"?"selected":""} value="admin">admin</option></select></td><td><select class="select plan-change" data-user="${esc(a.username)}"><option ${a.plan==="free"?"selected":""} value="free">free</option><option ${a.plan==="premium"?"selected":""} value="premium">premium</option></select></td><td>${date(a.created)}</td><td><button class="btn danger small delete-account" data-user="${esc(a.username)}">Supprimer</button></td></tr>`).join("") || emptyRow(5)}</tbody></table></div></section>`;
        qsa(".role-change").forEach(el => el.onchange = () => changeAccount(el.dataset.user,{role:el.value}));
        qsa(".plan-change").forEach(el => el.onchange = () => changeAccount(el.dataset.user,{plan:el.value}));
        qsa(".delete-account").forEach(el => el.onclick = async () => { if (el.dataset.user === state.username || !confirm("Supprimer ce compte ?")) return; try { await api("/api/accounts/delete","POST",{username:el.dataset.user}); toast("Compte supprimé"); renderAccounts(); } catch(error){showError(error)} });
      }
      async function changeAccount(username, payload) { try { await api("/api/accounts/setrole","POST",{username,...payload}); toast("Compte mis à jour"); } catch(error){showError(error)} }
      async function renderSettings() {
        const me = state.me || await api("/api/me"); state.me = me;
        qs("#main").innerHTML = pageHead("Settings", "Préférences et session actuelle.") +
          `<div class="split"><section class="card"><h3>Profil</h3><p class="muted">Utilisateur</p><p class="mono">${esc(me.username)}</p><p class="muted">Compte créé le</p><p>${date(me.created)}</p><p class="muted">Exécutions associées</p><p>${me.execCount}</p></section>
          <section class="card"><h3>Changer le mot de passe</h3><form id="password-form" class="stack"><input class="input" id="new-password" type="password" minlength="12" placeholder="Nouveau mot de passe · 12 caractères min" required><input class="input" id="new-password-2" type="password" minlength="12" placeholder="Confirmation" required><button class="btn primary">Mettre à jour</button></form></section></div>
          <section class="card" style="margin-top:14px"><h3>WebSocket</h3><p class="muted">Génère un ticket temporaire signé. La clé serveur n’est jamais renvoyée.</p><button class="btn ${["owner","admin"].includes(state.role) ? "primary" : ""}" id="ws-ticket" ${["owner","admin"].includes(state.role) ? "" : "disabled"}>Générer un ticket · 60 s</button><div id="ws-output" style="margin-top:12px"></div></section>`;
        qs("#password-form").onsubmit = async e => { e.preventDefault(); const a=qs("#new-password").value,b=qs("#new-password-2").value; if(a!==b)return toast("Les mots de passe ne correspondent pas","error"); try { await api("/api/profile/update","POST",{newPassword:a}); toast("Mot de passe modifié, reconnecte-toi"); setTimeout(()=>{clearAuth();showAuth()},900); } catch(error){showError(error)} };
        if (qs("#ws-ticket")) qs("#ws-ticket").onclick = async () => { try { const d=await api("/api/ws-ticket","POST"); qs("#ws-output").innerHTML=`<div class="ticket-box"><div><b>URL :</b> ${esc(d.url)}</div><div style="margin-top:7px"><b>Ticket :</b> ${esc(d.ticket)}</div><div style="margin-top:7px;color:var(--muted)">Expire : ${date(d.expiresAt)}</div></div>`; } catch(error){showError(error)} };
      }
      async function renderTickets() {
        const d = state.me || await api("/api/me"); state.me = d;
        qs("#main").innerHTML = pageHead("Tickets", "Demandes d’assistance liées à ton compte.") +
          `<div class="split"><section class="card"><h3>Nouveau ticket</h3><form id="ticket-form" class="stack"><input class="input" id="ticket-subject" maxlength="120" placeholder="Sujet" required><select class="select" id="ticket-category"><option>Other</option><option>Bug</option><option>Account</option><option>Question</option></select><textarea class="textarea" id="ticket-message" maxlength="500" placeholder="Message" required></textarea><button class="btn primary">Créer le ticket</button></form></section><section class="card"><h3>Mes tickets</h3><div class="list">${(d.tickets || []).map(t => `<div class="event"><div><strong>${esc(t.subject)}</strong><div class="muted">${esc(t.category)} · ${date(t.created)}</div><div style="margin-top:5px">${esc(t.message)}</div></div><span class="tag ${t.status==="closed"?"":"yellow"}">${esc(t.status)}</span></div>`).join("") || `<div class="empty">Aucun ticket</div>`}</div></section></div>`;
        qs("#ticket-form").onsubmit = async e => { e.preventDefault(); try { await api("/api/tickets/create","POST",{subject:qs("#ticket-subject").value,message:qs("#ticket-message").value,category:qs("#ticket-category").value}); toast("Ticket créé"); state.me=null; renderTickets(); } catch(error){showError(error)} };
      }
      async function go(page) {
        state.page = page; qsa(".nav").forEach(n => n.classList.toggle("active", n.dataset.page === page));
        try {
          if (page === "overview") await renderOverview();
          else if (page === "players") await renderPlayers();
          else if (page === "bans") await renderBans();
          else if (page === "bots") await renderBots();
          else if (page === "logs") await renderLogs();
          else if (page === "accounts") await renderAccounts();
          else if (page === "settings") await renderSettings();
          else if (page === "tickets") await renderTickets();
        } catch(error) { showError(error); }
      }
      function showError(error) { toast(error?.message || "Erreur inattendue", "error"); }
      if (state.token && W) showApp(); else showAuth();
    })();
  </script>
</body>
</html>
