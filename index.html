<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpyHub Gen URL Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0f;
    --panel: #12121a;
    --panel-2: #16161f;
    --border: #24242f;
    --violet: #8b5cf6;
    --violet-dim: #6d28d9;
    --cyan: #22d3ee;
    --text: #e4e4f0;
    --muted: #6b6b80;
    --danger: #f87171;
    --ok: #34d399;
    --radius: 10px;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--display);
    overflow: hidden;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(139,92,246,0.12), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(34,211,238,0.08), transparent 45%);
    display:flex;
    flex-direction:column;
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: rgba(18,18,26,0.7);
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .brand-mark{
    width:34px;
    height:34px;
    border-radius:8px;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:16px;
    color:#0a0a0f;
    box-shadow: 0 0 18px rgba(139,92,246,0.5);
    flex-shrink:0;
  }

  .brand-text{
    display:flex;
    flex-direction:column;
    line-height:1.1;
  }

  .brand-text .name{
    font-weight:700;
    font-size:16px;
    letter-spacing:0.2px;
  }

  .brand-text .name span{
    background: linear-gradient(90deg, var(--violet), var(--cyan));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .brand-text .tagline{
    font-family: var(--mono);
    font-size:10.5px;
    color: var(--muted);
    letter-spacing:0.5px;
    text-transform:uppercase;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .pill{
    font-family: var(--mono);
    font-size:11px;
    padding:6px 11px;
    border-radius:999px;
    border:1px solid var(--border);
    color: var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }

  .pill .dot{
    width:6px;height:6px;border-radius:50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
  }

  button{
    font-family: var(--display);
    cursor:pointer;
    border:none;
    outline:none;
  }

  .btn{
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:8px;
    display:flex;
    align-items:center;
    gap:7px;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{ transform: scale(0.96); }

  .btn-primary{
    background: linear-gradient(135deg, var(--violet), #7c3aed);
    color:#fff;
    box-shadow: 0 0 0 rgba(139,92,246,0);
  }
  .btn-primary:hover{
    box-shadow: 0 4px 22px rgba(139,92,246,0.45);
  }

  .btn-ghost{
    background: var(--panel-2);
    color: var(--text);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{ border-color: var(--violet-dim); }

  /* ---------- MAIN LAYOUT ---------- */
  main{
    flex:1;
    display:flex;
    overflow:hidden;
  }

  .pane{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .pane-editor{
    border-right:1px solid var(--border);
  }

  .pane-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--border);
    background: rgba(255,255,255,0.015);
  }

  .pane-title{
    font-family: var(--mono);
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color: var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
  }

  .traffic-lights{
    display:flex;
    gap:6px;
  }
  .traffic-lights span{
    width:9px;height:9px;border-radius:50%;
    display:inline-block;
  }
  .tl-r{ background:#ff5f57; }
  .tl-y{ background:#febc2e; }
  .tl-g{ background:#28c840; }

  .editor-wrap{
    flex:1;
    position:relative;
    display:flex;
    overflow:hidden;
  }

  .line-numbers{
    font-family: var(--mono);
    font-size:13px;
    line-height:1.6;
    color:#3a3a4a;
    text-align:right;
    padding:16px 10px 16px 0;
    user-select:none;
    background: rgba(0,0,0,0.15);
    overflow:hidden;
    min-width:44px;
  }

  #codeInput{
    flex:1;
    background:transparent;
    color: var(--text);
    font-family: var(--mono);
    font-size:13px;
    line-height:1.6;
    border:none;
    outline:none;
    resize:none;
    padding:16px 16px 16px 8px;
    white-space:pre;
    overflow:auto;
  }

  #codeInput::placeholder{
    color:#3f3f52;
  }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: #2a2a38; border-radius:6px; }
  ::-webkit-scrollbar-thumb:hover{ background: var(--violet-dim); }

  /* ---------- PREVIEW PANE ---------- */
  .browser-chrome{
    padding: 10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--panel-2);
    border-bottom:1px solid var(--border);
  }

  .url-bar{
    flex:1;
    background: rgba(0,0,0,0.35);
    border:1px solid var(--border);
    border-radius:999px;
    padding:7px 14px;
    font-family: var(--mono);
    font-size:12px;
    color: var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
    overflow:hidden;
    white-space:nowrap;
  }

  .url-bar .lock{
    color: var(--ok);
    flex-shrink:0;
  }

  .url-bar .slug{
    color: var(--cyan);
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .url-bar .slug .fixed{
    color: var(--muted);
  }

  iframe{
    flex:1;
    border:none;
    background:#fff;
    width:100%;
  }

  .empty-state{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    color: var(--muted);
    background:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(45deg, rgba(139,92,246,0.03) 0 2px, transparent 2px 14px);
  }

  .empty-state .glyph{
    font-size:38px;
    filter: drop-shadow(0 0 14px rgba(139,92,246,0.4));
  }

  .empty-state p{
    font-family: var(--mono);
    font-size:12.5px;
    max-width:280px;
    text-align:center;
    line-height:1.6;
  }

  /* ---------- FOOTER STATUS BAR ---------- */
  footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 18px;
    border-top:1px solid var(--border);
    background: var(--panel);
    font-family: var(--mono);
    font-size:11px;
    color: var(--muted);
  }

  footer .status-left{ display:flex; gap:16px; }
  footer .status-item{ display:flex; align-items:center; gap:5px; }

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed;
    bottom:46px;
    left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border:1px solid var(--violet-dim);
    color: var(--text);
    padding:11px 20px;
    border-radius:9px;
    font-size:13px;
    font-family: var(--display);
    font-weight:500;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 20px rgba(139,92,246,0.25);
    opacity:0;
    pointer-events:none;
    transition: all .3s cubic-bezier(.4,0,.2,1);
    z-index:100;
    display:flex;
    align-items:center;
    gap:8px;
  }
  #toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 860px){
    main{ flex-direction:column; }
    .pane-editor{ border-right:none; border-bottom:1px solid var(--border); }
    .pane{ min-height:0; }
    header{ flex-wrap:wrap; gap:10px; }
  }

  /* focus visibility */
  button:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--cyan);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">SH</div>
    <div class="brand-text">
      <div class="name">SpyHub <span>Gen URL Web</span></div>
      <div class="tagline">éditeur &amp; aperçu HTML en local</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="pill"><span class="dot"></span> Aperçu local actif</div>
    <button class="btn btn-ghost" id="clearBtn">Effacer</button>
    <button class="btn btn-ghost" id="downloadBtn">⬇ Télécharger</button>
    <button class="btn btn-primary" id="genBtn">⚡ Générer l'aperçu</button>
  </div>
</header>

<main>
  <section class="pane pane-editor">
    <div class="pane-header">
      <div class="pane-title">
        <span class="traffic-lights"><span class="tl-r"></span><span class="tl-y"></span><span class="tl-g"></span></span>
        index.html
      </div>
      <div class="pane-title" id="charCount">0 caractères</div>
    </div>
    <div class="editor-wrap">
      <div class="line-numbers" id="lineNumbers">1</div>
      <textarea id="codeInput" spellcheck="false" placeholder="&lt;!DOCTYPE html&gt;
&lt;html&gt;
  &lt;head&gt;
    &lt;title&gt;Mon site&lt;/title&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;h1&gt;Colle ton code ici...&lt;/h1&gt;
  &lt;/body&gt;
&lt;/html&gt;"></textarea>
    </div>
  </section>

  <section class="pane pane-preview">
    <div class="browser-chrome">
      <span class="traffic-lights"><span class="tl-r"></span><span class="tl-y"></span><span class="tl-g"></span></span>
      <div class="url-bar">
        <span class="lock">🔒</span>
        <span class="slug" id="urlSlug"><span class="fixed">preview://local/</span>en-attente</span>
      </div>
    </div>
    <div class="empty-state" id="emptyState">
      <div class="glyph">🡒 ⧉</div>
      <p>Colle du code HTML à gauche puis clique sur "Générer l'aperçu" pour le voir rendu ici.</p>
    </div>
    <iframe id="previewFrame" style="display:none;"></iframe>
  </section>
</main>

<footer>
  <div class="status-left">
    <div class="status-item">🖥 Rendu 100% local — rien n'est envoyé sur internet</div>
  </div>
  <div class="status-item">SpyHub Gen URL Web · v1.0</div>
</footer>

<div id="toast"></div>

<script>
  const codeInput = document.getElementById('codeInput');
  const lineNumbers = document.getElementById('lineNumbers');
  const charCount = document.getElementById('charCount');
  const previewFrame = document.getElementById('previewFrame');
  const emptyState = document.getElementById('emptyState');
  const urlSlug = document.getElementById('urlSlug');
  const toast = document.getElementById('toast');
  const genBtn = document.getElementById('genBtn');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  function updateLineNumbers(){
    const lines = codeInput.value.split('\n').length;
    let out = '';
    for(let i=1;i<=lines;i++) out += i + '\n';
    lineNumbers.textContent = out;
    charCount.textContent = codeInput.value.length + ' caractères';
  }

  codeInput.addEventListener('input', updateLineNumbers);
  codeInput.addEventListener('scroll', () => {
    lineNumbers.scrollTop = codeInput.scrollTop;
  });
  updateLineNumbers();

  function randomSlug(){
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let s = '';
    for(let i=0;i<8;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function generatePreview(){
    const code = codeInput.value;
    if(!code.trim()){
      showToast('⚠ Colle du code avant de générer');
      return;
    }

    urlSlug.innerHTML = '<span class="fixed">preview://local/</span>génération...';

    setTimeout(() => {
      const slug = randomSlug();
      urlSlug.innerHTML = '<span class="fixed">preview://local/</span>' + slug;

      emptyState.style.display = 'none';
      previewFrame.style.display = 'block';
      previewFrame.srcdoc = code;

      showToast('✓ Aperçu généré (rendu local, sans lien partageable)');
    }, 500);
  }

  genBtn.addEventListener('click', generatePreview);

  clearBtn.addEventListener('click', () => {
    codeInput.value = '';
    updateLineNumbers();
    previewFrame.style.display = 'none';
    previewFrame.srcdoc = '';
    emptyState.style.display = 'flex';
    urlSlug.innerHTML = '<span class="fixed">preview://local/</span>en-attente';
    showToast('🗑 Éditeur vidé');
  });

  downloadBtn.addEventListener('click', () => {
    const code = codeInput.value;
    if(!code.trim()){
      showToast('⚠ Rien à télécharger');
      return;
    }
    const blob = new Blob([code], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'site.html';
    a.click();
    URL.revokeObjectURL(url);
    showToast('⬇ Fichier téléchargé : site.html');
  });

  // Ctrl+Enter to generate
  codeInput.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      generatePreview();
    }
  });
</script>

</body>
</html>
